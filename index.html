<style>
  html, body { margin: 0; height: 100%; background: #050817; color: #dbe7ff; }
  body { display: grid; place-items: center; padding: 0 16px; font: 600 17px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
  b { display: block; margin-bottom: 6px; color: #ffc531; font-size: 20px; letter-spacing: .04em; }
  a { color: #7fd8ff; }
</style>
<script>
/* Hero Block taşındı: bu adresteki kayıtlar yeni adrese götürülür (yalnızca cihazda, # sonrası sunucuya gitmez) */
(function () {
  var HEDEF = 'https://heroblock.herouygulama.com.tr/';
  var veri = {}, n = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && /^(blokKahramani\.|bk-)/.test(k) && k !== 'blokKahramani.tablo') { veri[k] = localStorage.getItem(k); n++; }
    }
  } catch (e) { n = 0; }
  var adres = HEDEF + '#tasi=' + (n ? encodeURIComponent(JSON.stringify(veri)) : 'yok');
  var gitti = false;
  function git() { if (!gitti) { gitti = true; location.replace(adres); } }
  // Eski çevrimdışı kopya ve hizmet çalışanı kaldırılır (en çok 1 saniye beklenir)
  var isler = [];
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      isler.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
    }
  } catch (e) { /* yok */ }
  try {
    if (window.caches) {
      isler.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('blok-kahramani-') === 0; }).map(function (k) { return caches.delete(k); })); }));
    }
  } catch (e) { /* yok */ }
  if (isler.length && window.Promise) { Promise.all(isler).then(git, git); setTimeout(git, 1000); } else git();
})();
</script>
</head>
<body>
<p><b>HERO BLOCK</b>Oyun yeni adresine taşındı:<br><a href="https://heroblock.herouygulama.com.tr/">heroblock.herouygulama.com.tr</a></p>
</body>
