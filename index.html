<script>
(() => {
  'use strict';

  /* ================= Sabitler ================= */
  const N = 8;
  const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Neon kahraman paleti: elektrik mavisi, camgöbeği, altın, kehribar, kraliyet mavisi
  const PALETTE = [
    { rgb: '43,140,255',  light: '#a8d4ff', base: '#2b8cff', dark: '#0b3c9e', face1: '#64aeff', face2: '#1d6bec', rim: 'rgba(196,228,255,.95)', spark: '#8cc8ff' },
    { rgb: '24,212,242',  light: '#c0f9ff', base: '#18d4f2', dark: '#05708c', face1: '#62e7fb', face2: '#0caed4', rim: 'rgba(210,252,255,.95)', spark: '#96f4ff' },
    { rgb: '255,197,49',  light: '#fff4bd', base: '#ffc531', dark: '#a86504', face1: '#ffda70', face2: '#f2a414', rim: 'rgba(255,246,206,.98)', spark: '#ffe38f' },
    { rgb: '255,150,40',  light: '#ffdcab', base: '#ff9628', dark: '#9a3f04', face1: '#ffb45e', face2: '#ec7811', rim: 'rgba(255,229,196,.95)', spark: '#ffc480' },
    { rgb: '110,112,255', light: '#d3d4ff', base: '#6e70ff', dark: '#29269c', face1: '#9496ff', face2: '#5254ea', rim: 'rgba(224,225,255,.95)', spark: '#b3b4ff' }
  ];
  const GREY  = { rgb: '120,135,170', light: '#6c7795', base: '#3b4566', dark: '#1a2137', face1: '#4a5577', face2: '#323b5a', rim: 'rgba(150,166,205,.35)', spark: '#8090b0', noGlow: true, gloss: 0.14 };
  const WHITE = { rgb: '220,240,255', light: '#ffffff', base: '#ffffff', dark: '#dcefff', face1: '#ffffff', face2: '#eaf6ff', rim: '#ffffff', spark: '#ffffff' };

  // Fotoğraflı bloklar: bu parçaların her karesinde renk yerine fotoğraf (altın çerçeveli)
  //   1. fotoğraf: yatay Z (s4b) ve tersi S (s4a); 2. fotoğraf: iki yönlü çapraz üçlü (d3a, d3b)
  const PHOTO_COL = { rgb: '255,197,49', light: '#fff4bd', base: '#ffc531', dark: '#a86504', face1: '#ffda70', face2: '#f2a414', rim: 'rgba(255,246,206,.98)', spark: '#ffe38f' };
  const PHOTOS = [
    { shapes: ['s4a', 's4b'], src: '' },
    { shapes: ['d3a', 'd3b'], src: '' }
  ];
  const PHOTO_IDX = PALETTE.length;               // ilk fotoğraflı karenin tahtadaki değeri (5, 6, ...)
  const PHOTO_OF = {};                            // parça kimliği → fotoğraflı karenin değeri
  PHOTOS.forEach((ph, k) => ph.shapes.forEach(id => { PHOTO_OF[id] = PHOTO_IDX + k; }));
  const COLORS = PALETTE.concat(PHOTOS.map(() => PHOTO_COL)); // renk numarasından renge: parıltı, ışın, kıvılcım
  const isPhoto = v => v >= PHOTO_IDX;

  // [kimlik, desen, ağırlık, kademe (0 küçük, 1 orta, 2 büyük)]
  const SHAPE_DEFS = [
    ['o1',  ['#'], 3, 0],
    ['i2h', ['##'], 5, 0],
    ['i2v', ['#', '#'], 5, 0],
    ['i3h', ['###'], 5, 1],
    ['i3v', ['#', '#', '#'], 5, 1],
    ['i4h', ['####'], 3.4, 1],
    ['i4v', ['#', '#', '#', '#'], 3.4, 1],
    ['i5h', ['#####'], 1.6, 2],
    ['i5v', ['#', '#', '#', '#', '#'], 1.6, 2],
    ['o2',  ['##', '##'], 5, 1],
    ['o3',  ['###', '###', '###'], 1, 2],
    ['r23', ['###', '###'], 2, 2],
    ['r32', ['##', '##', '##'], 2, 2],
    ['l3a', ['#.', '##'], 3, 0],
    ['l3b', ['.#', '##'], 3, 0],
    ['l3c', ['##', '#.'], 3, 0],
    ['l3d', ['##', '.#'], 3, 0],
    ['l4a', ['#.', '#.', '##'], 1.6, 1],
    ['l4b', ['.#', '.#', '##'], 1.6, 1],
    ['l4c', ['##', '#.', '#.'], 1.6, 1],
    ['l4d', ['##', '.#', '.#'], 1.6, 1],
    ['l4e', ['###', '#..'], 1.6, 1],
    ['l4f', ['###', '..#'], 1.6, 1],
    ['l4g', ['#..', '###'], 1.6, 1],
    ['l4h', ['..#', '###'], 1.6, 1],
    ['t4a', ['###', '.#.'], 2.2, 1],
    ['t4b', ['.#.', '###'], 2.2, 1],
    ['t4c', ['#.', '##', '#.'], 2.2, 1],
    ['t4d', ['.#', '##', '.#'], 2.2, 1],
    ['s4a', ['.##', '##.'], 2.8, 1],
    ['s4b', ['##.', '.##'], 2.8, 1],
    ['s4c', ['#.', '##', '.#'], 0.8, 1],
    ['s4d', ['.#', '##', '#.'], 0.8, 1],
    ['l5a', ['#..', '#..', '###'], 1, 2],
    ['l5b', ['..#', '..#', '###'], 1, 2],
    ['l5c', ['###', '#..', '#..'], 1, 2],
    ['l5d', ['###', '..#', '..#'], 1, 2],
    ['d3a', ['..#', '.#.', '#..'], 2.8, 1],
    ['d3b', ['#..', '.#.', '..#'], 2.8, 1]
  ];

  /* ================= Yardımcılar ================= */
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInCubic = t => t * t * t;
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const NF = new Intl.NumberFormat('tr-TR');
  const fmt = n => NF.format(Math.round(n));
  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };

  // Yuvarlak köşeli dikdörtgen: rrAdd mevcut yola ekler, rr yeni yol başlatır
  function rrAdd(g, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function rr(g, x, y, w, h, r) { g.beginPath(); rrAdd(g, x, y, w, h, r); }

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* depolama kapalı */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* depolama kapalı */ } }
  };
  // Yeni puanlamayla rekor ve kayıt sıfırdan başlar (eski anahtarlar okunmaz)
  const K_BEST = 'blokKahramani.rekor.v2';
  const K_SAVE = 'blokKahramani.kayit.v2';
  const K_SOUND = 'blokKahramani.ses';

  /* ================= DOM ================= */
  const cvBg = $('bg'), cvCells = $('cells'), cvHl = $('hl'), cvTray = $('trayCv'), canvas = $('game'), dragEl = $('dragEl');
  const bctx = cvBg.getContext('2d');    // yıldızlar + tahta çerçevesi + boş hücreler + raf paneli (sabit)
  const cctx = cvCells.getContext('2d'); // yerleşmiş bloklar (yalnızca tahta değişince)
  const hctx = cvHl.getContext('2d');    // yerleştirme önizlemesi (yalnızca hedef kare değişince)
  const tctx = cvTray.getContext('2d');  // raftaki parçalar (yalnızca raf değişince)
  const ctx = canvas.getContext('2d');   // patlama efektleri (yalnızca efekt sürerken)
  const dctx = dragEl.getContext('2d');  // sürüklenen parça (bir kez çizilir)
  const stage = $('stage');
  const twinkleEl = $('twinkle');
  const ringWrap = $('ringWrap');
  const hud = $('hud');
  const hudScoreBox = $('hudScoreBox');
  const hudScore = $('hudScore');
  const hudBest = $('hudBest');
  const hudComboBox = $('hudComboBox');
  const hudBestBox = document.querySelector('.hud-best');
  const hudCombo = $('hudCombo');
  const pipsEl = hudComboBox.querySelector('.pips');
  let pips = [];
  const hint = $('hint');
  const floatsEl = $('floats');
  const btnRestart = $('btnRestart');
  const btnSound = $('btnSound');
  const ovOver = $('ovOver');
  const ovConfirm = $('ovConfirm');
  const probe = $('insetProbe');
  const live = $('live');

  /* ================= Şekiller ================= */
  const SHAPES = SHAPE_DEFS.map(([id, rows, weight, tier]) => {
    const cells = [];
    rows.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') cells.push([r, c]); });
    return { id, cells, w: rows[0].length, h: rows.length, weight, tier };
  });
  const SHAPE_BY_ID = Object.fromEntries(SHAPES.map(s => [s.id, s]));

  /* ================= Oyun durumu ================= */
  const board = new Int8Array(N * N).fill(-1);   // -1 boş, 0..4 renk
  let tray = [null, null, null];
  let score = 0, displayScore = 0;
  let best = Math.max(0, Number(store.get(K_BEST, 0)) || 0);
  let bestAtStart = best;
  let combo = 0, comboMoves = 0, maxCombo = 0, linesTotal = 0, moves = 0;
  let gameState = 'play';                          // play | ending | over
  let overT0 = 0, overTimer = 0, overSoundTimer = 0;
  let drag = null, hoverSlot = -1;
  let pops = [], ghosts = [], beams = [], particles = [];
  let pieceUid = 0;
  let soundOn = store.get(K_SOUND, true) !== false;

  /* ================= Çizim zamanlayıcısı =================
     Kare yalnızca bir şey değiştiğinde ya da animasyon sürerken çizilir; oyun beklerken hiçbir şey çizilmez. */
  let rafId = 0, last = 0, frameDt = 1 / 60, animUntil = 0, trayAnimUntil = 0, wasBusy = false, trayWasBusy = false;
  let cellsDirty = true, fxDirty = true, trayDirty = true, previewDirty = false, previewKey = '', greyRows = -1;
  function wake() { if (!rafId) rafId = requestAnimationFrame(frame); }
  function animate(ms) { animUntil = Math.max(animUntil, performance.now() + ms); wake(); }
  function animateTray(ms) { trayAnimUntil = Math.max(trayAnimUntil, performance.now() + ms); trayDirty = true; wake(); }

  /* ================= Yerleşim ================= */
  const L = { W: 0, H: 0, dpr: 1, fxDpr: 1, cs: 40, bs: 320, fp: 8, bx: 0, by: 0, mode: 'col', hud: { x: 0, y: 0, w: 0, h: 0 }, tray: { x: 0, y: 0, w: 0, h: 0 }, slotW: 0 };
  const REG = { x: 0, y: 0, w: 0, h: 0 };          // tahta bölgesi: bloklar ve önizleme katmanları yalnızca burayı kaplar
  const TRG = { x: 0, y: 0, w: 0, h: 0 };          // raf bölgesi
  const FP = 0.026, HUD_K = 0.255, G1 = 0.045, G2 = 0.055, TRAY_K = 0.4, PANEL_K = 0.95, GX = 0.06, MAX_B = 600;
  let sprites = [], greySprite = null, whiteSprite = null, spritePad = 0, dragSize = 0;
  const photoImgs = [];
  let greyPhotos = [];

  function readInsets() {
    const s = getComputedStyle(probe);
    return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
  }

  function hudRows() {
    const u = L.bs, h = L.hud;
    const off = Math.max(0, (h.h - u * HUD_K) / 2);
    return { a: h.y + off + u * 0.06, b: h.y + off + u * 0.18 };
  }

  function placeBtn(el, x, y, s) {
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(y) + 'px';
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    el.style.borderRadius = Math.round(s * 0.32) + 'px';
  }

  // Tuvali verilen sayfa dikdörtgenine yerleştirir; çizimler yine sayfa koordinatlarıyla yapılır
  function sizeLayer(cv, g, x, y, w, h, d) {
    d = d || L.dpr;
    const bw = Math.max(1, Math.round(w * d)), bh = Math.max(1, Math.round(h * d));
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
    const st = cv.style;
    st.left = x + 'px';
    st.top = y + 'px';
    st.width = w + 'px';
    st.height = h + 'px';
    g.setTransform(d, 0, 0, d, -x * d, -y * d);
    g.clearRect(x, y, w, h);
  }

  // Sayfa dikdörtgenini cihaz pikseline hizalanmış, ekranla sınırlı bir bölgeye çevirir
  function snapRect(out, x0, y0, x1, y1) {
    const d = L.dpr;
    x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(L.W, x1); y1 = Math.min(L.H, y1);
    out.x = Math.floor(x0 * d) / d;
    out.y = Math.floor(y0 * d) / d;
    out.w = Math.ceil((x1 - out.x) * d) / d;
    out.h = Math.ceil((y1 - out.y) * d) / d;
  }

  let layoutKey = '';
  function layout() {
    const W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight);
    // 2x çözünürlük üst sınırı: 3x ekranlarda çizilecek piksel sayısı yarı yarıya azalır, görüntü yine keskin kalır
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const ins = readInsets();
    const key = [W, H, dpr, ins.t, ins.r, ins.b, ins.l].join('|');
    if (key === layoutKey) return; // boyut aynıysa hiçbir şeyi yeniden kurma
    layoutKey = key;
    L.W = W; L.H = H; L.dpr = dpr;
    // Hızlı hareket eden efektler (patlama, kıvılcım) daha düşük çözünürlükte: her karede daha az piksel
    L.fxDpr = Math.min(dpr, 1.5);
    const m = clamp(Math.min(W, H) * 0.03, 8, 22);
    const aw = Math.max(120, W - ins.l - ins.r - 2 * m);
    const ah = Math.max(120, H - ins.t - ins.b - 2 * m);
    const outerK = 1 + 2 * FP;
    const Bcol = Math.min(aw / outerK, ah / (HUD_K + G1 + outerK + G2 + TRAY_K), MAX_B);
    const Bside = Math.min(ah / outerK, aw / (outerK + GX + PANEL_K), MAX_B);
    const side = Bside > Bcol * 1.2;
    const cs = Math.max(12, Math.floor((side ? Bside : Bcol) / N));
    const bs = cs * N;
    const fp = Math.max(6, Math.round(bs * FP));
    const outer = bs + 2 * fp;
    L.cs = cs; L.bs = bs; L.fp = fp; L.mode = side ? 'side' : 'col';
    if (!side) {
      const hudH = bs * HUD_K, g1 = bs * G1, g2 = bs * G2, trayH = bs * TRAY_K;
      const extra = Math.max(0, ah - (hudH + g1 + outer + g2 + trayH));
      const top = ins.t + m + extra * 0.4;
      const left = ins.l + m + (aw - outer) / 2;
      L.bx = left + fp;
      L.by = top + hudH + g1 + fp;
      L.hud = { x: left, y: top, w: outer, h: hudH };
      L.tray = { x: left, y: L.by + bs + fp + g2 + extra * 0.15, w: outer, h: trayH };
    } else {
      const gx = bs * GX;
      const panelW = Math.min(aw - outer - gx, bs * 1.05);
      const left = ins.l + m + (aw - (outer + gx + panelW)) / 2;
      const top = ins.t + m + (ah - outer) / 2;
      L.bx = left + fp;
      L.by = top + fp;
      const px = left + outer + gx;
      L.hud = { x: px, y: top, w: panelW, h: outer * 0.46 };
      L.tray = { x: px, y: top + outer * 0.5, w: panelW, h: outer * 0.5 };
    }
    L.slotW = L.tray.w / 3;
    // Tahta ve raf bölgeleri: blokların parıltısı da sığsın; kenarlar cihaz pikseline hizalı
    spritePad = Math.ceil(cs * 0.42);
    const rp = spritePad + 2, t = L.tray;
    snapRect(REG, L.bx - rp, L.by - rp, L.bx + bs + rp, L.by + bs + rp);
    snapRect(TRG, t.x - rp, t.y - rp, t.x + t.w + rp, t.y + t.h * 1.5 + rp); // altta giriş animasyonu için pay
    placeHtml();
    buildSprites();
    sizeLayer(cvBg, bctx, 0, 0, W, H);
    sizeLayer(canvas, ctx, 0, 0, W, H, L.fxDpr);
    sizeLayer(cvCells, cctx, REG.x, REG.y, REG.w, REG.h);
    sizeLayer(cvHl, hctx, REG.x, REG.y, REG.w, REG.h);
    sizeLayer(cvTray, tctx, TRG.x, TRG.y, TRG.w, TRG.h);
    // Sürükleme tuvali: en uzun parçayı (5 blok) alacak kare
    dragSize = Math.ceil((5 * cs + 2 * rp) * dpr) / dpr;
    dragEl.width = dragEl.height = Math.round(dragSize * dpr);
    dragEl.style.width = dragEl.style.height = dragSize + 'px';
    if (drag) prepareDragEl(drag.piece);
    drawBg();
    buildTwinkle();
    cellsDirty = true;
    fxDirty = true;
    trayDirty = true;
    previewKey = '';
    previewDirty = true;
    wake();
  }

  // HTML öğelerini (HUD, düğmeler, kombo halesi, ipucu) tuvaldeki yerleşime oturt
  function placeHtml() {
    const rs = document.documentElement.style;
    rs.setProperty('--u', L.bs + 'px');
    rs.setProperty('--cs', L.cs + 'px');
    const h = L.hud, R = hudRows(), hs = hud.style;
    hs.left = h.x + 'px';
    hs.top = h.y + 'px';
    hs.width = h.w + 'px';
    hs.height = h.h + 'px';
    hs.setProperty('--ya', (R.a - h.y) + 'px');
    hs.setProperty('--yb', (R.b - h.y) + 'px');
    hs.setProperty('--pad', (L.bs * 0.015) + 'px');
    const bsz = Math.round(clamp(L.bs * 0.105, 36, 50));
    placeBtn(btnRestart, h.x, R.a - bsz / 2, bsz);
    placeBtn(btnSound, h.x + h.w - bsz, R.a - bsz / 2, bsz);
    const o = L.fp + Math.max(3, L.cs * 0.08), sz = L.bs + o * 2, ws = ringWrap.style;
    ws.left = (L.bx - o) + 'px';
    ws.top = (L.by - o) + 'px';
    ws.width = sz + 'px';
    ws.height = sz + 'px';
    ws.borderRadius = (L.fp * 1.5 + 3) + 'px';
    hint.style.left = (L.bx + L.bs / 2) + 'px';
    hint.style.top = (L.by + L.bs / 2) + 'px';
    scoreText = '';
    bestText = '';
    setScoreText(displayScore);
    updateHud();
  }

  /* ================= Önceden çizilen grafikler ================= */
  // Her renk için tek bir blok resmi (parıltısıyla birlikte) bir kez çizilir; oyun sırasında sadece kopyalanır
  function makeSprite(col) {
    const cs = L.cs, dpr = L.dpr;
    const pad = spritePad;
    const size = cs + pad * 2;
    const cv = document.createElement('canvas');
    cv.width = cv.height = Math.ceil(size * dpr);
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gap = Math.max(1, cs * 0.05);
    const x = pad + gap, y = pad + gap, s = cs - gap * 2, r = s * 0.2;
    if (!col.noGlow) { // neon parıltı
      g.save();
      g.shadowColor = 'rgba(' + col.rgb + ',0.95)';
      g.shadowBlur = cs * 0.38 * dpr;
      g.fillStyle = col.base;
      rr(g, x, y, s, s, r); g.fill();
      g.restore();
    }
    // eğimli dış gövde
    let gr = g.createLinearGradient(x, y, x + s, y + s);
    gr.addColorStop(0, col.light); gr.addColorStop(0.5, col.base); gr.addColorStop(1, col.dark);
    g.fillStyle = gr; rr(g, x, y, s, s, r); g.fill();
    // iç yüz
    const b = s * 0.13, fx = x + b, fy = y + b, fs = s - 2 * b, fr = r * 0.6;
    gr = g.createLinearGradient(0, fy, 0, fy + fs);
    gr.addColorStop(0, col.face1); gr.addColorStop(1, col.face2);
    g.fillStyle = gr; rr(g, fx, fy, fs, fs, fr); g.fill();
    // cam parlaması
    gr = g.createLinearGradient(0, fy, 0, fy + fs * 0.55);
    gr.addColorStop(0, 'rgba(255,255,255,' + (col.gloss == null ? 0.42 : col.gloss) + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; rr(g, fx, fy, fs, fs * 0.55, fr); g.fill();
    if (!col.noGlow) {
      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.beginPath(); g.arc(fx + fs * 0.17, fy + fs * 0.17, Math.max(0.8, s * 0.045), 0, Math.PI * 2); g.fill();
    }
    const lw = Math.max(1, cs * 0.03);
    g.lineWidth = lw; g.strokeStyle = col.rim;
    rr(g, x + lw / 2, y + lw / 2, s - lw, s - lw, r); g.stroke();
    return { cv, size };
  }

  // Fotoğraflı blok: neon parıltı, altın çerçeve, yuvarlak köşeli fotoğraf ve cam parlaması.
  // grey: sığmayan parçada ve oyun sonunda kullanılan soluk, gri tonlu hali
  function makePhotoSprite(photoImg, grey) {
    const cs = L.cs, dpr = L.dpr, pad = spritePad, size = cs + pad * 2, col = PHOTO_COL;
    const cv = document.createElement('canvas');
    cv.width = cv.height = Math.ceil(size * dpr);
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gap = Math.max(1, cs * 0.05);
    const x = pad + gap, y = pad + gap, s = cs - gap * 2, r = s * 0.2;
    if (!grey) { // neon parıltı
      g.save();
      g.shadowColor = 'rgba(' + col.rgb + ',0.95)';
      g.shadowBlur = cs * 0.38 * dpr;
      g.fillStyle = col.base;
      rr(g, x, y, s, s, r); g.fill();
      g.restore();
    }
    let gr = g.createLinearGradient(x, y, x + s, y + s);
    gr.addColorStop(0, col.light); gr.addColorStop(0.5, col.base); gr.addColorStop(1, col.dark);
    g.fillStyle = gr; rr(g, x, y, s, s, r); g.fill();
    const b = s * 0.09, fx = x + b, fy = y + b, fs = s - 2 * b, fr = r * 0.7;
    g.save();
    rr(g, fx, fy, fs, fs, fr); g.clip();
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(photoImg, fx, fy, fs, fs);
    gr = g.createLinearGradient(0, fy, 0, fy + fs * 0.5);
    gr.addColorStop(0, 'rgba(255,255,255,0.28)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(fx, fy, fs, fs * 0.5);
    g.restore();
    g.lineWidth = Math.max(1, cs * 0.02); g.strokeStyle = 'rgba(110,55,0,0.6)';
    rr(g, fx, fy, fs, fs, fr); g.stroke();
    const lw = Math.max(1, cs * 0.03);
    g.lineWidth = lw; g.strokeStyle = col.rim;
    rr(g, x + lw / 2, y + lw / 2, s - lw, s - lw, r); g.stroke();
    if (grey) { // gri tonlu ve koyu: diğer sığmayan parçalarla aynı soluk görünüm
      try {
        g.setTransform(1, 0, 0, 1, 0, 0);
        const im = g.getImageData(0, 0, cv.width, cv.height), d = im.data;
        for (let k = 0; k < d.length; k += 4) {
          const l = d[k] * 0.3 + d[k + 1] * 0.59 + d[k + 2] * 0.11;
          d[k] = l * 0.42 + 22; d[k + 1] = l * 0.44 + 26; d[k + 2] = l * 0.5 + 44;
        }
        g.putImageData(im, 0, 0);
      } catch (e) { freeCanvas(cv); return null; }
    }
    return { cv, size };
  }

  // iPhone eski tuvallerin belleğini geç bırakıyor; yenilerini kurmadan önce boşalt
  function freeCanvas(cv) { if (cv) { cv.width = 0; cv.height = 0; } }

  function buildSprites() {
    sprites.forEach(s => freeCanvas(s.cv));
    if (greySprite) freeCanvas(greySprite.cv);
    if (whiteSprite) freeCanvas(whiteSprite.cv);
    greyPhotos.forEach(g => g && freeCanvas(g.cv));
    // fotoğraflı bloklar renklerden sonra (5, 6, ...); fotoğraf yüklenene kadar altın blok
    sprites = PALETTE.map(makeSprite).concat(PHOTOS.map((ph, k) => (photoImgs[k] ? makePhotoSprite(photoImgs[k], false) : makeSprite(PHOTO_COL))));
    greySprite = makeSprite(GREY);
    greyPhotos = PHOTOS.map((ph, k) => (photoImgs[k] ? makePhotoSprite(photoImgs[k], true) : null));
    whiteSprite = makeSprite(WHITE);
  }

  // Sığmayan parçada / oyun sonunda karenin soluk hali (fotoğraflı kare fotoğrafını korur)
  function greyOf(v) { return (isPhoto(v) && greyPhotos[v - PHOTO_IDX]) || greySprite; }

  // Fotoğraflar kodun içinde (internetsiz de çalışır); her biri çözülünce bloklar yeniden çizilir
  PHOTOS.forEach((ph, k) => {
    const img = new Image();
    img.onload = () => {
      photoImgs[k] = img;
      if (!sprites.length) return; // yerleşim henüz kurulmadı: ilk kurulumda kullanılır
      buildSprites();
      if (drag) prepareDragEl(drag.piece);
      cellsDirty = true; trayDirty = true; fxDirty = true; previewKey = ''; previewDirty = true;
      wake();
    };
    img.src = ph.src;
  });

  // Sabit arka katman: yıldızlar, tahta çerçevesi, boş hücreler, altın köşeler, raf paneli
  function drawBg() {
    const g = bctx, { cs, bs, fp, dpr } = L;
    // yıldızlar (üst bilgi alanına düşenler atlanır)
    const n = Math.round(clamp((L.W * L.H) / 9000, 40, 140)), hd = L.hud;
    for (let i = 0; i < n; i++) {
      const x = Math.random() * L.W, y = Math.random() * L.H;
      if (x > hd.x - 4 && x < hd.x + hd.w + 4 && y > hd.y - 4 && y < hd.y + hd.h + 4) continue;
      g.globalAlpha = rand(0.14, 0.55);
      g.fillStyle = Math.random() < 0.18 ? '#ffd76a' : '#a6cdff';
      const r = rand(0.6, 1.7);
      g.fillRect(x, y, r, r);
    }
    g.globalAlpha = 1;
    const x0 = L.bx - fp, y0 = L.by - fp, outer = bs + 2 * fp, R = fp * 1.5;
    // dış mavi hale
    g.save();
    g.shadowColor = 'rgba(43,120,255,0.55)';
    g.shadowBlur = cs * 0.8 * dpr;
    g.fillStyle = '#0a1335';
    rr(g, x0, y0, outer, outer, R); g.fill();
    g.restore();
    // panel
    let gr = g.createLinearGradient(0, y0, 0, y0 + outer);
    gr.addColorStop(0, '#0f1c4b'); gr.addColorStop(1, '#070d28');
    g.fillStyle = gr; rr(g, x0, y0, outer, outer, R); g.fill();
    // camgöbeğinden altına kenarlık
    const lw = Math.max(1.5, cs * 0.045);
    gr = g.createLinearGradient(x0, y0, x0 + outer, y0 + outer);
    gr.addColorStop(0, 'rgba(95,215,255,0.95)');
    gr.addColorStop(0.5, 'rgba(50,110,255,0.55)');
    gr.addColorStop(1, 'rgba(255,197,49,0.9)');
    g.lineWidth = lw; g.strokeStyle = gr;
    rr(g, x0 + lw / 2, y0 + lw / 2, outer - lw, outer - lw, R - lw / 2); g.stroke();
    // boş hücreler
    const gap = Math.max(1, cs * 0.06), cr = cs * 0.16;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = L.bx + c * cs + gap, y = L.by + r * cs + gap, s = cs - gap * 2;
        const alt = (r + c) & 1;
        gr = g.createLinearGradient(0, y, 0, y + s);
        gr.addColorStop(0, alt ? '#111e4a' : '#13224f');
        gr.addColorStop(1, alt ? '#0a1433' : '#0c1738');
        g.fillStyle = gr; rr(g, x, y, s, s, cr); g.fill();
        g.lineWidth = 1; g.strokeStyle = 'rgba(120,175,255,0.10)';
        rr(g, x + 0.5, y + 0.5, s - 1, s - 1, cr); g.stroke();
      }
    }
    // altın köşe braketleri
    const bl = cs * 0.8, off = Math.max(3, fp * 0.5), br = Math.min(R + off, bl * 0.7);
    g.save();
    g.strokeStyle = '#ffc531';
    g.lineWidth = Math.max(2, cs * 0.065);
    g.lineCap = 'round';
    g.shadowColor = 'rgba(255,197,49,0.9)';
    g.shadowBlur = cs * 0.3 * dpr;
    const xa = x0 - off, ya = y0 - off, xb = x0 + outer + off, yb = y0 + outer + off;
    const corner = (cx, cy, dx, dy) => {
      g.beginPath();
      g.moveTo(cx, cy + dy * bl);
      g.arcTo(cx, cy, cx + dx * bl, cy, br);
      g.lineTo(cx + dx * bl, cy);
      g.stroke();
    };
    corner(xa, ya, 1, 1); corner(xb, ya, -1, 1); corner(xa, yb, 1, -1); corner(xb, yb, -1, -1);
    g.restore();
    // raf paneli
    const t = L.tray;
    rr(g, t.x, t.y, t.w, t.h, cs * 0.45);
    gr = g.createLinearGradient(0, t.y, 0, t.y + t.h);
    gr.addColorStop(0, 'rgba(16,30,80,0.42)');
    gr.addColorStop(1, 'rgba(8,14,40,0.25)');
    g.fillStyle = gr;
    g.fill();
    g.strokeStyle = 'rgba(92,160,255,0.14)';
    g.lineWidth = 1;
    g.stroke();
    g.strokeStyle = 'rgba(92,160,255,0.08)';
    for (let i = 1; i < 3; i++) {
      const x = Math.round(t.x + L.slotW * i) + 0.5;
      g.beginPath(); g.moveTo(x, t.y + t.h * 0.2); g.lineTo(x, t.y + t.h * 0.8); g.stroke();
    }
  }

  // Boş alanlara birkaç parlayıp sönen yıldız (her biri kendi hızında)
  function buildTwinkle() {
    twinkleEl.textContent = '';
    const n = Math.round(clamp((L.W * L.H) / 22000, 8, 28));
    const avoid = [L.hud, { x: L.bx - L.fp, y: L.by - L.fp, w: L.bs + 2 * L.fp, h: L.bs + 2 * L.fp }, L.tray];
    const frag = document.createDocumentFragment();
    let placed = 0, tries = 0;
    while (placed < n && tries++ < n * 25) {
      const x = Math.random() * L.W, y = Math.random() * L.H;
      if (avoid.some(r => x > r.x - 8 && x < r.x + r.w + 8 && y > r.y - 8 && y < r.y + r.h + 8)) continue;
      const el = document.createElement('i');
      if (Math.random() < 0.25) el.className = 'g';
      el.style.left = x.toFixed(1) + 'px';
      el.style.top = y.toFixed(1) + 'px';
      el.style.animationDuration = rand(2.2, 4.6).toFixed(2) + 's';
      el.style.animationDelay = (-rand(0, 4.6)).toFixed(2) + 's';
      frag.appendChild(el);
      placed++;
    }
    twinkleEl.appendChild(frag);
  }

  /* ================= HUD ve efekt yazıları (HTML) ================= */
  let scoreText = '', bestText = '', comboKey = '';

  function setScoreText(n) {
    const t = fmt(n);
    if (t === scoreText) return;
    const lenChanged = t.length !== scoreText.length;
    scoreText = t;
    hudScore.textContent = t;
    if (lenChanged) fitScore();
  }

  // Skor, iki yandaki REKOR ve KOMBO bloklarının arasına sığacak boya küçülür (yalnızca uzunluk değişince ölçülür)
  function fitScore() {
    const base = L.bs * 0.13;
    hudScoreBox.style.fontSize = base + 'px';
    const side = Math.max(hudBestBox.offsetWidth, hudComboBox.offsetWidth);
    const avail = L.hud.w - 2 * (L.bs * 0.015) - 2 * side - 16;
    const w = hudScore.offsetWidth;
    if (avail > 0 && w > avail) hudScoreBox.style.fontSize = Math.max(10, Math.floor((base * avail) / w)) + 'px';
  }

  function updateHud() {
    let sidesChanged = false;
    const bt = fmt(best);
    if (bt !== bestText) {
      sidesChanged = bt.length !== bestText.length;
      bestText = bt;
      hudBest.textContent = bt;
      hudBest.style.fontSize = (Math.max(13, L.bs * 0.054) * Math.min(1, 8 / bt.length)) + 'px';
    }
    const key = combo + '|' + comboMoves + '|' + gameState;
    if (key !== comboKey) {
      sidesChanged = true;
      comboKey = key;
      const on = combo > 0;
      hudComboBox.classList.toggle('on', on);
      hudCombo.textContent = on ? '×' + fmt(combo) : '—';
      // Elmaslar: kombonun bozulmasına kalan hamle sayısı
      if (pips.length !== MODE.combo) {
        pipsEl.innerHTML = '<i></i>'.repeat(MODE.combo);
        pips = Array.prototype.slice.call(pipsEl.children);
      }
      pips.forEach((el, k) => el.classList.toggle('on', k < comboMoves));
      const ringOn = combo >= 2 && gameState === 'play';
      ringWrap.style.opacity = ringOn ? String(clamp(0.35 + combo * 0.1, 0, 1)) : '0';
    }
    if (sidesChanged && scoreText) fitScore();
  }

  // Küçük "zıplama" efekti: Web Animations ile, yalnızca dönüşüm (GPU)
  function bump(el, s) {
    if (REDUCED || typeof el.animate !== 'function') return;
    try { el.animate([{ transform: 'scale(' + s + ')' }, { transform: 'scale(1)' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.3,1)' }); } catch (e) { /* desteklenmiyor */ }
  }

  function spawnFloat(text, x, y, kind, delay) {
    const el = document.createElement('div');
    el.className = 'float float-' + kind;
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    if (delay) el.style.animationDelay = delay + 'ms';
    const done = () => { if (el.parentNode) el.parentNode.removeChild(el); };
    el.addEventListener('animationend', done);
    setTimeout(done, 1400 + (delay || 0)); // animasyon olayı gelmezse yine de temizle
    floatsEl.appendChild(el);
    while (floatsEl.childElementCount > 9) floatsEl.removeChild(floatsEl.firstElementChild);
  }

  // Ekran sarsıntısı: oyun alanı katmanları birlikte, GPU'da kaydırılır (yeniden çizim yok)
  function shake(amp) {
    if (REDUCED || typeof stage.animate !== 'function') return;
    const kf = [];
    for (let i = 0; i < 6; i++) {
      const a = amp * Math.pow(1 - i / 6, 2);
      kf.push({ transform: 'translate(' + rand(-a, a).toFixed(1) + 'px,' + rand(-a, a).toFixed(1) + 'px)' });
    }
    kf.push({ transform: 'translate(0px,0px)' });
    try { stage.animate(kf, { duration: 280, easing: 'linear' }); } catch (e) { /* desteklenmiyor */ }
  }

  function updateHint() { hint.hidden = !(moves === 0 && gameState === 'play' && !drag); }
  function setModal() { document.body.classList.toggle('modal', !ovOver.hidden || !ovConfirm.hidden); }

  // Uzun sayılar kutusuna sığsın diye yazı boyunu küçültür
  function fitText(el, text, maxPx, width) {
    el.textContent = text;
    el.style.fontSize = text.length > 6 ? Math.max(11, Math.min(maxPx, Math.floor(width / (0.6 * text.length)))) + 'px' : '';
  }

  /* ================= Oyun mantığı ================= */
  /* === PARÇA ÜRETİCİ (saf fonksiyonlar: tahtayı parametre olarak alır, simülasyonla da test edilir) ===
     Tek mod, cömert üretici:
       - yeni üçlü o anki tahtaya her zaman bir sırayla tamamen sığar;
       - kombo sürerken üçlüde, kalan hamle hakkı içinde çizgi patlatan bir yol bulunur (dikkatli oynayan komboyu koparmaz);
       - parçaların çoğu çizgi tamamlayan şekillerden seçilir, tahta doldukça küçük parçalar sıklaşır;
       - üçlüde en fazla bir büyük parça bulunur.
     MODE.combo  : patlatma olmadan kaç hamle sonra kombonun bozulduğu (milyonlara ulaşılabilsin diye 5)
     MODE.assist1: 1. parçanın, assist2: diğer parçaların çizgi tamamlayan şekillerden seçilme olasılığı
     MODE.keep   : kombo sürerken komboyu koruyan bir üçlünün aranma olasılığı */
  const MODE = { combo: 5, assist1: 0.85, assist2: 0.5, keep: 1 };

  function canPlaceOn(bd, s, r0, c0) {
    if (r0 < 0 || c0 < 0 || r0 + s.h > N || c0 + s.w > N) return false;
    const cells = s.cells;
    for (let k = 0; k < cells.length; k++) if (bd[(r0 + cells[k][0]) * N + c0 + cells[k][1]] >= 0) return false;
    return true;
  }

  function fitsOn(bd, s) {
    for (let r = 0; r <= N - s.h; r++) for (let c = 0; c <= N - s.w; c++) if (canPlaceOn(bd, s, r, c)) return true;
    return false;
  }

  // Parçayı yerleştirip dolan satır ve sütunları temizler; yeni tahtayı döndürür (patlayan çizgi sayısı: placeAndClear.lines)
  function placeAndClear(bd, s, r0, c0) {
    const nb = new Int8Array(bd);
    for (const [r, c] of s.cells) nb[(r0 + r) * N + c0 + c] = 0;
    const fullR = [], fullC = [];
    for (let r = 0; r < N; r++) {
      let f = true;
      for (let c = 0; c < N; c++) if (nb[r * N + c] < 0) { f = false; break; }
      if (f) fullR.push(r);
    }
    for (let c = 0; c < N; c++) {
      let f = true;
      for (let r = 0; r < N; r++) if (nb[r * N + c] < 0) { f = false; break; }
      if (f) fullC.push(c);
    }
    for (const r of fullR) for (let c = 0; c < N; c++) nb[r * N + c] = -1;
    for (const c of fullC) for (let r = 0; r < N; r++) nb[r * N + c] = -1;
    placeAndClear.lines = fullR.length + fullC.length;
    return nb;
  }

  // Şu an en az bir satırı ya da sütunu tamamlayabilen şekiller
  function clearingShapesOn(bd) {
    const rowCnt = new Int8Array(N), colCnt = new Int8Array(N);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (bd[r * N + c] >= 0) { rowCnt[r]++; colCnt[c]++; }
    const addR = new Int8Array(N), addC = new Int8Array(N);
    const out = [];
    for (const s of SHAPES) {
      let ok = false;
      for (let r0 = 0; r0 <= N - s.h && !ok; r0++) {
        for (let c0 = 0; c0 <= N - s.w && !ok; c0++) {
          if (!canPlaceOn(bd, s, r0, c0)) continue;
          addR.fill(0); addC.fill(0);
          for (const [r, c] of s.cells) { addR[r0 + r]++; addC[c0 + c]++; }
          for (let i = 0; i < N; i++) {
            if ((addR[i] && rowCnt[i] + addR[i] === N) || (addC[i] && colCnt[i] + addC[i] === N)) { ok = true; break; }
          }
        }
      }
      if (ok) out.push(s);
    }
    return out;
  }

  // Üç parça bir sırayla tahtaya sığıyor mu? need > 0 ise ilk need yerleştirmeden biri çizgi de patlatmalı.
  // Derinlik öncelikli arama; iş miktarı (budget.left) sınırlı.
  function solvable(bd, shapes, budget, need) {
    need = need || 0;
    let nodes = 0;
    const rec = (b, rest, depth, ok) => {
      const seen = {};
      for (let k = 0; k < rest.length; k++) {
        const s = rest[k];
        if (seen[s.id]) continue;
        seen[s.id] = 1;
        const others = rest.filter((_, j) => j !== k);
        for (let r = 0; r <= N - s.h; r++) {
          for (let c = 0; c <= N - s.w; c++) {
            if (!canPlaceOn(b, s, r, c)) continue;
            if (ok && !others.length) return true;
            if (++nodes > budget.left) return false;
            const nb = placeAndClear(b, s, r, c);
            const ok2 = ok || (depth < need && placeAndClear.lines > 0);
            if (!ok2 && depth + 1 >= need) continue; // patlatma şartı bu yolda artık sağlanamaz
            if (!others.length) return true;
            if (rec(nb, others, depth + 1, ok2)) return true;
            if (nodes > budget.left) return false;
          }
        }
      }
      return false;
    };
    const ok = rec(bd, shapes, 0, need <= 0);
    budget.left -= nodes;
    return ok;
  }

  // Ağırlık: tahta doldukça küçük parçalar (tier 0) sıklaşır, büyükler (tier 2) seyrekleşir
  function shapeWeight(s, fill) {
    const k = s.tier === 0 ? 1.4 + 1.6 * fill : s.tier === 2 ? Math.max(0.05, 0.3 - 0.5 * fill) : 1 - 0.3 * fill;
    return s.weight * k;
  }

  function pickWeighted(pool, fill) {
    let total = 0;
    const ws = pool.map(s => { const w = shapeWeight(s, fill); total += w; return w; });
    let x = Math.random() * total;
    for (let i = 0; i < pool.length; i++) { x -= ws[i]; if (x <= 0) return pool[i]; }
    return pool[pool.length - 1];
  }

  // need: kombo sürüyorsa kombonun bozulmasına kalan hamle sayısı, yoksa 0
  function chooseTrayShapes(bd, mode, need) {
    let filled = 0;
    for (let i = 0; i < N * N; i++) if (bd[i] >= 0) filled++;
    const fill = filled / (N * N);
    const fitting = SHAPES.filter(s => fitsOn(bd, s));
    const small = fitting.filter(s => s.tier === 0);
    const clearers = clearingShapesOn(bd);
    let keep = need > 0 && Math.random() < mode.keep ? Math.min(need, 3) : 0;
    if (keep === 1 && !clearers.length) keep = 0; // tek hamlede patlatabilecek şekil yok
    const kb = { left: 30000 }, budget = { left: 60000 };
    let picks = null;
    for (let attempt = 0; attempt < 40; attempt++) {
      // yalnızca şu an sığan şekiller; 24 denemede olmazsa yalnızca küçükler
      const base = attempt < 24 && fitting.length ? fitting : small.length ? small : SHAPES;
      picks = [];
      let big = false;
      for (let i = 0; i < 3; i++) {
        let pool = clearers.length && Math.random() < (i === 0 ? mode.assist1 : mode.assist2) ? clearers : base;
        if (big) { const rest = pool.filter(q => q.tier < 2); if (rest.length) pool = rest; }
        const s = pickWeighted(pool, fill);
        if (s.tier === 2) big = true;
        picks.push(s);
      }
      if (keep && attempt < 20 && kb.left > 0) { if (solvable(bd, picks, kb, keep)) return picks; continue; }
      if (budget.left <= 0 || solvable(bd, picks, budget, 0)) return picks;
    }
    return picks;
  }

  // Puanlama: yerleştirilen her kare 1 puan (commitPlace); patlayan her kare 10 puan,
  // aynı hamlede 2 çizgi 2 kat, 3 çizgi 3 kat...; hepsi kombo ile çarpılır. Kombo art arda her patlatmada 1 artar.
  function clearPoints(cells, lines, combo) {
    return 10 * cells * lines * combo;
  }
  /* === PARÇA ÜRETİCİ BİTİŞ === */

  function canPlace(p, r0, c0) { return canPlaceOn(board, p, r0, c0); }
  function fitsAnywhere(p) { return fitsOn(board, p); }

  function refreshFits() {
    for (const p of tray) if (p) p.fits = fitsAnywhere(p);
    trayDirty = true;
    wake();
  }

  function fullLines() {
    const rows = [], cols = [];
    for (let r = 0; r < N; r++) {
      let full = true;
      for (let c = 0; c < N; c++) if (board[r * N + c] < 0) { full = false; break; }
      if (full) rows.push(r);
    }
    for (let c = 0; c < N; c++) {
      let full = true;
      for (let r = 0; r < N; r++) if (board[r * N + c] < 0) { full = false; break; }
      if (full) cols.push(c);
    }
    return { rows, cols };
  }

  // Parça buraya konsaydı hangi satır/sütunlar dolardı? (önizleme için)
  function linesIfPlaced(p, r0, c0) {
    const idx = p.cells.map(([r, c]) => (r0 + r) * N + c0 + c);
    for (const i of idx) board[i] = 99;
    const res = fullLines();
    for (const i of idx) board[i] = -1;
    return res;
  }

  function makePiece(shape, color) {
    if (PHOTO_OF[shape.id] !== undefined) color = PHOTO_OF[shape.id];
    return { uid: ++pieceUid, shape, cells: shape.cells, w: shape.w, h: shape.h, color, fits: true, enter: null, ret: null, hv: 0 };
  }

  const ENTER = { delay: 60, stagger: 60, dur: 320 };
  function startEnter(pieces) {
    const now = performance.now();
    pieces.forEach((p, i) => { if (p) p.enter = { t0: now + ENTER.delay + i * ENTER.stagger, dur: ENTER.dur }; });
    animateTray(ENTER.delay + 2 * ENTER.stagger + ENTER.dur + 40);
  }

  function generateTray() {
    const colors = shuffle([0, 1, 2, 3, 4]);
    const pieces = shuffle(chooseTrayShapes(board, MODE, combo > 0 ? comboMoves : 0).map((s, i) => makePiece(s, colors[i])));
    for (const p of pieces) p.fits = fitsAnywhere(p);
    startEnter(pieces);
    return pieces;
  }

  function setBest(v) {
    best = v;
    store.set(K_BEST, best);
  }

  function addScore(n) {
    if (n <= 0) return;
    score += n;
    if (score > best) setBest(score);
    bump(hudScore, n >= 50 ? 1.16 : 1.08);
    wake();
  }

  function commitPlace(p, slot, r0, c0) {
    const now = performance.now();
    tray[slot] = null;
    const idx = p.cells.map(([r, c]) => (r0 + r) * N + c0 + c);
    if (ghosts.length) ghosts = ghosts.filter(g => idx.indexOf(g.r * N + g.c) < 0);
    for (const i of idx) { board[i] = p.color; pops.push({ i, t0: now, s: 1, fl: 0 }); }
    moves++;
    addScore(p.cells.length); // yerleştirilen her kare +1
    Sound.place();
    const ln = fullLines();
    if (ln.rows.length || ln.cols.length) {
      doClear(ln.rows, ln.cols, p, r0, c0, now);
    } else if (combo > 0) {
      // Kombo: üst üste belirli sayıda hamlede patlatma olmazsa kombo bozulur
      comboMoves--;
      if (comboMoves <= 0) { combo = 0; comboMoves = 0; }
    }
    if (!tray[0] && !tray[1] && !tray[2]) tray = generateTray();
    refreshFits();
    save();
    updateHud();
    updateHint();
    cellsDirty = true;
    animate(220);
    if (!tray.some(t => t && t.fits)) triggerGameOver();
  }

  function doClear(rows, cols, p, r0, c0, now) {
    const set = new Set();
    for (const r of rows) for (let c = 0; c < N; c++) set.add(r * N + c);
    for (const c of cols) for (let r = 0; r < N; r++) set.add(r * N + c);
    const lines = rows.length + cols.length;
    combo += 1;
    comboMoves = MODE.combo;
    const pts = clearPoints(set.size, lines, combo);
    if (combo > maxCombo) maxCombo = combo;
    linesTotal += lines;

    // Patlama dalgası: parçanın merkezinden çizgi boyunca dışarı doğru
    const pcR = r0 + (p.h - 1) / 2, pcC = c0 + (p.w - 1) / 2;
    let sr = 0, sc = 0;
    for (const i of set) {
      const r = (i / N) | 0, c = i % N;
      let d = 99;
      if (rows.indexOf(r) >= 0) d = Math.min(d, Math.abs(c - pcC));
      if (cols.indexOf(c) >= 0) d = Math.min(d, Math.abs(r - pcR));
      const own = isPhoto(p.color) || isPhoto(board[i]);
      ghosts.push({ r, c, color: own ? board[i] : p.color, t0: now + 50 + d * 30, dur: 340, burst: false, s: 1, a: 1, fl: 0 });
      board[i] = -1;
      sr += r; sc += c;
    }
    if (pops.length) pops = pops.filter(q => !set.has(q.i));
    const { bx, by, cs, bs } = L;
    const ox = bx + (pcC + 0.5) * cs, oy = by + (pcR + 0.5) * cs;
    for (const r of rows) beams.push({ type: 'row', i: r, o: ox, t0: now + 30, dur: 440, color: p.color });
    for (const c of cols) beams.push({ type: 'col', i: c, o: oy, t0: now + 30, dur: 440, color: p.color });
    addScore(pts);

    let perfect = true;
    for (let i = 0; i < N * N; i++) if (board[i] >= 0) { perfect = false; break; }
    // Yazılar patlayan bölgeye yakın ama tahtanın ortasına doğru çekilmiş durur
    const mx = bx + bs / 2;
    const fx = mx + (bx + (sc / set.size + 0.5) * cs - mx) * 0.3;
    const fy = clamp(by + (sr / set.size + 0.5) * cs, by + bs * 0.25, by + bs * 0.75);
    const praise = perfect ? 'TERTEMİZ!' : lines >= 4 ? 'KAHRAMAN!' : lines === 3 ? 'MUHTEŞEM!' : lines === 2 ? 'HARİKA!' : combo >= 5 && combo % 5 === 0 ? 'SÜPER!' : '';
    const items = [];
    if (praise) items.push([praise, 'praise']);
    if (combo >= 2) items.push(['KOMBO ×' + fmt(combo), 'combo']);
    items.push(['+' + fmt(pts), 'pts']);
    const gap = cs * 0.9, y0 = fy - ((items.length - 1) * gap) / 2;
    items.forEach((it, k) => spawnFloat(it[0], fx, y0 + k * gap, it[1], k * 60));

    shake(Math.min(8, 1.5 + lines * 1.8));
    if (combo >= 2) bump(hudCombo, 1.3);
    Sound.clear(lines, combo);
    buzz(lines > 1 ? [18, 40, 22] : 16);
    announce(lines + ' çizgi patladı, +' + fmt(pts) + ' puan' + (combo >= 2 ? ', kombo ×' + combo : '') + '. Skor ' + fmt(score) + '.');
  }

  function triggerGameOver() {
    if (gameState !== 'play') return;
    gameState = 'ending';
    overT0 = performance.now() + 650;
    store.del(K_SAVE);
    clearTimeout(overTimer);
    clearTimeout(overSoundTimer);
    overSoundTimer = setTimeout(() => Sound.over(), 650);
    overTimer = setTimeout(showOver, 650 + N * 75 + 450);
    updateHud();
    updateHint();
    trayDirty = true;
    wake();
  }

  function showOver() {
    gameState = 'over';
    greyRows = N;
    cellsDirty = true;
    wake();
    const isNew = score > bestAtStart && score > 0;
    $('goBadge').hidden = !isNew;
    fitText($('goBest'), fmt(best), 18, 92);
    fitText($('goLines'), fmt(linesTotal), 18, 92);
    fitText($('goCombo'), '×' + fmt(maxCombo), 18, 92);
    const goScore = $('goScore'), finalLen = fmt(score).length;
    goScore.style.fontSize = finalLen > 7 ? Math.max(28, Math.floor(300 / (0.62 * finalLen))) + 'px' : '';
    goScore.textContent = '0';
    ovConfirm.hidden = true;
    ovOver.hidden = false;
    setModal();
    countUp(goScore, score, 900);
    setTimeout(() => focusDialog('btnAgain', 'goCard'), 60);
    announce('Kaybettin. Skor ' + fmt(score) + (isNew ? '. Yeni rekor!' : '.'));
  }

  function countUp(el, target, dur) {
    const t0 = performance.now();
    const step = now => {
      const q = clamp((now - t0) / dur, 0, 1);
      el.textContent = fmt(target * easeOutCubic(q));
      if (q < 1 && !ovOver.hidden) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function newGame() {
    clearTimeout(overTimer);
    clearTimeout(overSoundTimer);
    board.fill(-1);
    score = 0; displayScore = 0;
    combo = 0; comboMoves = 0; maxCombo = 0; linesTotal = 0; moves = 0;
    bestAtStart = best;
    pops = []; ghosts = []; beams = []; particles = [];
    floatsEl.textContent = '';
    if (drag) { drag = null; canvas.classList.remove('grabbing'); hideDragEl(); }
    gameState = 'play';
    greyRows = -1;
    tray = generateTray();
    refreshFits();
    ovOver.hidden = true;
    ovConfirm.hidden = true;
    setModal();
    setScoreText(0);
    updateHud();
    updateHint();
    cellsDirty = true;
    fxDirty = true;
    wake();
    save();
  }

  function snapshotState() {
    if (gameState !== 'play') return null;
    return {
      v: 2, board: Array.from(board), tray: tray.map(p => (p ? [p.shape.id, p.color] : null)),
      score, combo, comboMoves, maxCombo, linesTotal, moves, bestAtStart
    };
  }

  function save() {
    const s = snapshotState();
    if (s) store.set(K_SAVE, s);
  }

  // Kayıtlı oyunu geri yükler: verilen anlık durumdan ya da tarayıcı deposundan
  function load(s) {
    if (s === undefined) s = store.get(K_SAVE, null);
    if (!s || s.v !== 2 || !Array.isArray(s.board) || s.board.length !== N * N || !Array.isArray(s.tray) || s.tray.length !== 3) return false;
    try {
      const bd = new Int8Array(N * N);
      for (let i = 0; i < N * N; i++) {
        const v = s.board[i];
        bd[i] = Number.isInteger(v) && v >= 0 && v < COLORS.length ? v : -1;
      }
      const t = s.tray.map(x => (Array.isArray(x) && SHAPE_BY_ID[x[0]] ? makePiece(SHAPE_BY_ID[x[0]], clamp(x[1] | 0, 0, PALETTE.length - 1)) : null));
      if (t.some(Boolean) && !t.some(p => p && fitsOn(bd, p))) return false; // kayıtlı oyun zaten bitmiş
      board.set(bd);
      pops = []; ghosts = []; beams = []; particles = [];
      score = Math.max(0, Math.floor(Number(s.score) || 0)); displayScore = score;
      combo = Math.max(0, Math.floor(Number(s.combo) || 0)); comboMoves = clamp(s.comboMoves | 0, 0, MODE.combo);
      maxCombo = Math.max(0, Math.floor(Number(s.maxCombo) || 0)); linesTotal = Math.max(0, s.linesTotal | 0); moves = Math.max(0, s.moves | 0);
      bestAtStart = Number.isFinite(s.bestAtStart) ? s.bestAtStart : best;
      if (score > best) setBest(score);
      gameState = 'play';
      greyRows = -1;
      tray = t.some(Boolean) ? t : generateTray();
      startEnter(tray);
      refreshFits();
      setScoreText(score);
      updateHud();
      updateHint();
      cellsDirty = true;
      fxDirty = true;
      if (!tray.some(p => p && p.fits)) triggerGameOver();
      return true;
    } catch (e) {
      return false;
    }
  }

  // Klavye kullanıcısına düğmeyi odakla; dokunmatik/farede halka göstermeden pencereye odaklan
  let keyboardUser = false;
  document.addEventListener('keydown', () => { keyboardUser = true; }, true);
  document.addEventListener('pointerdown', () => { keyboardUser = false; }, true);
  function focusDialog(btnId, cardId) {
    try { $(keyboardUser ? btnId : cardId).focus({ preventScroll: true }); } catch (e) { /* odak yok */ }
  }

  function announce(msg) {
    live.textContent = '';
    setTimeout(() => { live.textContent = msg; }, 30);
  }

  function buzz(pattern) {
    if (!soundOn) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* titreşim yok */ }
  }

  /* ================= Ses (WebAudio ile sentez, dosya yok) =================
     iPhone notları: Safari, Web Audio seslerini telefon sessiz moddayken kısar. Ses oturumu "playback"e
     alınınca (iOS 16.4+) sessiz modda da çalar; eski sürümlerde sessiz bir <audio> döngüsü aynı işi görür.
     Ses bağlamı ancak bir dokunuş sırasında açılabildiği için her dokunuşta (touchend/click) yeniden denenir.
     Telefon hoparlörü kalın sesleri pek vermediği için sesler 500 Hz üstünde ve sıkıştırıcıyla dolgun. */
  const Sound = {
    ac: null, out: null, nbuf: null, resumeT: -1e9, silentEl: null,
    session() {
      try {
        if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
      } catch (e) { /* desteklenmiyor */ }
    },
    ensure() {
      if (this.ac) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { this.ac = new AC({ latencyHint: 'interactive' }); } catch (e) {
        try { this.ac = new AC(); } catch (e2) { return false; }
      }
      this.out = this.chain(this.ac);
      return true;
    },
    // Ana çıkış: sıkıştırıcı, sesleri telefon hoparlöründe dolgun ve eşit yüksek tutar (patlamalarda cızırtı yapmadan)
    chain(ac) {
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.18;
      const out = ac.createGain(), post = ac.createGain();
      out.gain.value = 1;
      post.gain.value = 1.65; // sıkıştırmadan sonra yükselt: telefon hoparlöründe net duyulsun
      out.connect(comp);
      comp.connect(post);
      post.connect(ac.destination);
      return out;
    },
    // Eski iOS: sessiz bir sesin döngüde çalınması, sessiz moddayken de Web Audio'nun duyulmasını sağlar
    silentLoop() {
      if (this.silentEl || navigator.audioSession || !/iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) || !('ontouchend' in document)) return;
      try {
        const rate = 8000, n = 800, buf = new Uint8Array(44 + n);
        const w32 = (o, v) => { buf[o] = v & 255; buf[o + 1] = (v >> 8) & 255; buf[o + 2] = (v >> 16) & 255; buf[o + 3] = (v >> 24) & 255; };
        const w16 = (o, v) => { buf[o] = v & 255; buf[o + 1] = (v >> 8) & 255; };
        [82, 73, 70, 70].forEach((c, i) => { buf[i] = c; }); w32(4, 36 + n);
        [87, 65, 86, 69, 102, 109, 116, 32].forEach((c, i) => { buf[8 + i] = c; });
        w32(16, 16); w16(20, 1); w16(22, 1); w32(24, rate); w32(28, rate); w16(32, 1); w16(34, 8);
        [100, 97, 116, 97].forEach((c, i) => { buf[36 + i] = c; }); w32(40, n);
        buf.fill(128, 44);
        let bin = '';
        for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
        const el = document.createElement('audio');
        el.src = 'data:audio/wav;base64,' + btoa(bin);
        el.loop = true;
        el.setAttribute('playsinline', '');
        el.setAttribute('x-webkit-airplay', 'deny');
        el.preload = 'auto';
        this.silentEl = el;
        const p = el.play();
        if (p && p.catch) p.catch(() => { this.silentEl = null; });
      } catch (e) { this.silentEl = null; }
    },
    // Dokunuş anında çağrılır: ses bağlamını açar; iOS'un sesi gerçekten açması için tek örneklik sessiz ses çalar
    unlock() {
      if (!soundOn) return;
      this.session();
      if (!this.ensure()) return;
      const ac = this.ac;
      if (ac.state !== 'running') {
        try {
          const p = ac.resume();
          if (p && p.catch) p.catch(() => {});
          this.resumeT = performance.now();
          const b = ac.createBuffer(1, 1, ac.sampleRate), s = ac.createBufferSource();
          s.buffer = b;
          s.connect(ac.destination);
          s.start(0);
        } catch (e) { /* ses desteklenmiyor */ }
      }
      this.silentLoop();
      if (this.silentEl && this.silentEl.paused && !document.hidden) { const p = this.silentEl.play(); if (p && p.catch) p.catch(() => {}); }
    },
    // Sayfa gizlenince ya da ses kapatılınca: sessiz döngü durur; ses kapalıysa ses oturumu da bırakılır (müzik uygulaması sürebilsin)
    pause() {
      if (this.silentEl && !this.silentEl.paused) this.silentEl.pause();
      if (!soundOn && this.ac && this.ac.state === 'running') { const p = this.ac.suspend(); if (p && p.catch) p.catch(() => {}); }
    },
    // Bağlam açıksa ya da az önce açılması istendiyse çal: ilk dokunuşun sesi de kaybolmaz
    ok() {
      const ac = this.ac;
      return soundOn && !!ac && (ac.state === 'running' || (ac.state !== 'closed' && performance.now() - this.resumeT < 500));
    },
    tone(f, dur, type, vol, delay, f2) {
      if (!this.ok()) return;
      const ac = this.ac, t = ac.currentTime + (delay || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.out);
      o.start(t); o.stop(t + dur + 0.05);
    },
    noise(dur, vol, freq, delay) {
      if (!this.ok()) return;
      const ac = this.ac, t = ac.currentTime + (delay || 0);
      if (!this.nbuf) {
        const len = Math.floor(ac.sampleRate * 0.6);
        this.nbuf = ac.createBuffer(1, len, ac.sampleRate);
        const d = this.nbuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      const src = ac.createBufferSource();
      src.buffer = this.nbuf;
      const f = ac.createBiquadFilter();
      f.type = 'bandpass'; f.Q.value = 0.8;
      f.frequency.setValueAtTime(freq, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(300, freq * 0.3), t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.out);
      src.start(t); src.stop(t + dur + 0.05);
    },
    pick() { this.tone(988, 0.07, 'triangle', 0.38); },
    place() { this.tone(660, 0.1, 'triangle', 0.55, 0, 440); this.noise(0.05, 0.3, 3600); },
    bad() { this.tone(392, 0.16, 'square', 0.24, 0, 262); },
    clear(lines, cmb) {
      const base = 659.25 * Math.pow(2, Math.min(Math.max(cmb - 1, 0), 12) / 12); // kombo arttıkça ton yükselir
      [0, 4, 7, 12, 16, 19].slice(0, Math.min(6, 2 + lines)).forEach((st, i) => {
        const f = base * Math.pow(2, st / 12);
        this.tone(f, 0.22, 'triangle', 0.3, i * 0.05);
        this.tone(f * 2, 0.16, 'sine', 0.09, i * 0.05);
      });
      this.noise(0.3, 0.24, 5200);
    },
    over() { [784, 659, 523, 392].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.28, i * 0.15)); }
  };

  /* ================= Çizim ================= */
  // Hazır blok resmini kopyalar; tam boyutta piksele hizalanır (daha hızlı ve keskin)
  function drawCell(g, spr, x, y, size, a, s) {
    const d = spr.size * (size / L.cs) * s;
    let px = x + size / 2 - d / 2, py = y + size / 2 - d / 2;
    if (s === 1 && size === L.cs) { const k = L.dpr; px = Math.round(px * k) / k; py = Math.round(py * k) / k; }
    if (a !== 1) g.globalAlpha = a;
    g.drawImage(spr.cv, px, py, d, d);
    if (a !== 1) g.globalAlpha = 1;
  }

  function drawPiece(g, p, cx, cy, size, a, spr) {
    const x0 = cx - (p.w * size) / 2, y0 = cy - (p.h * size) / 2;
    for (const [r, c] of p.cells) drawCell(g, spr, x0 + c * size, y0 + r * size, size, a, 1);
  }

  // Yerleşmiş bloklar katmanı: yalnızca tahta değiştiğinde yeniden çizilir
  function renderCells() {
    const { bx, by, cs } = L;
    cctx.clearRect(REG.x, REG.y, REG.w, REG.h);
    const gr = gameState === 'play' ? -1 : greyRows;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = board[r * N + c];
        if (v < 0) continue;
        drawCell(cctx, r < gr ? greyOf(v) : sprites[v], bx + c * cs, by + r * cs, cs, 1, 1);
      }
    }
  }

  // Önizleme katmanı: parçanın oturacağı yer ve patlayacak çizgiler; yalnızca hedef kare değişince çizilir.
  // Patlama olacaksa katman CSS ile hafifçe nabız gibi atar.
  function renderPreview() {
    hctx.clearRect(REG.x, REG.y, REG.w, REG.h);
    const pv = drag && drag.preview;
    const willClear = !!(pv && pv.rows.length + pv.cols.length);
    cvHl.classList.toggle('pulse', willClear);
    if (!pv) return;
    const { r: r0, c: c0, rows, cols } = pv;
    const p = drag.piece, spr = sprites[p.color], col = COLORS[p.color];
    const { bx, by, cs, bs } = L;
    if (willClear) {
      hctx.fillStyle = 'rgba(' + col.rgb + ',0.2)';
      hctx.beginPath();
      for (const r of rows) rrAdd(hctx, bx - 2, by + r * cs, bs + 4, cs, cs * 0.2);
      for (const c of cols) rrAdd(hctx, bx + c * cs, by - 2, cs, bs + 4, cs * 0.2);
      hctx.fill();
      // Patlayacak çizgilerdeki bloklar parçanın rengine bürünür
      const seen = new Set(), marked = [];
      const mark = (r, c) => { const i = r * N + c; if (!seen.has(i) && board[i] >= 0) { seen.add(i); marked.push(i); } };
      for (const r of rows) for (let c = 0; c < N; c++) mark(r, c);
      for (const c of cols) for (let r = 0; r < N; r++) mark(r, c);
      // fotoğraflı parçada kareler kendi renginde kalır; fotoğraflı kare hiçbir parçada boyanmaz
      for (const i of marked) drawCell(hctx, isPhoto(p.color) || isPhoto(board[i]) ? sprites[board[i]] : spr, bx + (i % N) * cs, by + ((i / N) | 0) * cs, cs, 1, 1);
      hctx.globalCompositeOperation = 'lighter';
      for (const i of marked) drawCell(hctx, whiteSprite, bx + (i % N) * cs, by + ((i / N) | 0) * cs, cs, 0.2, 1);
      hctx.globalCompositeOperation = 'source-over';
    }
    const a = willClear ? 0.8 : 0.4;
    for (const [r, c] of p.cells) drawCell(hctx, spr, bx + (c0 + c) * cs, by + (r0 + r) * cs, cs, a, 1);
  }

  // Sürüklenen parça: kendi küçük tuvaline bir kez çizilir, sonra yalnızca konumu değişir
  function prepareDragEl(p) {
    const d = L.dpr, side = dragSize;
    dctx.setTransform(d, 0, 0, d, 0, 0);
    dctx.clearRect(0, 0, side, side);
    drawPiece(dctx, p, side / 2, side / 2, L.cs, 1, sprites[p.color]);
  }

  function positionDrag(now) {
    const v = dragVisual(drag, now), h = dragSize / 2, s = v.cs / L.cs;
    dragEl.style.transform = 'translate(' + (v.x - h).toFixed(2) + 'px,' + (v.y - h).toFixed(2) + 'px) scale(' + s.toFixed(3) + ')';
  }

  function hideDragEl() {
    dragEl.classList.remove('on');
    previewKey = '';
    previewDirty = true;
    wake();
  }

  // Yeni konan bloklar kısa bir an büyüyüp parlar
  const POP_MS = 200;
  function drawPops(now) {
    if (!pops.length) return;
    let k = 0;
    for (const p of pops) if (now - p.t0 < POP_MS) pops[k++] = p;
    pops.length = k;
    if (!k) return;
    const { bx, by, cs } = L;
    for (const p of pops) {
      const v = board[p.i];
      if (v < 0) continue;
      const q = clamp((now - p.t0) / POP_MS, 0, 1);
      p.s = 1 + 0.16 * (1 - easeOutCubic(q));
      p.fl = (1 - q) * 0.5;
      drawCell(ctx, sprites[v], bx + (p.i % N) * cs, by + ((p.i / N) | 0) * cs, cs, 1, p.s);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of pops) {
      if (board[p.i] < 0 || p.fl <= 0.01) continue;
      drawCell(ctx, whiteSprite, bx + (p.i % N) * cs, by + ((p.i / N) | 0) * cs, cs, p.fl, p.s);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // Patlayan bloklar: önce gövdeler, sonra tek seferde beyaz parlamalar
  function drawGhosts(now) {
    if (!ghosts.length) return;
    let k = 0;
    for (const g of ghosts) if ((now - g.t0) / g.dur < 1) ghosts[k++] = g;
    ghosts.length = k;
    if (!k) return;
    const { bx, by, cs } = L;
    for (const g of ghosts) {
      const p = (now - g.t0) / g.dur;
      const x = bx + g.c * cs, y = by + g.r * cs;
      if (p < 0) { g.s = 1; g.a = 1; g.fl = 0.18; }
      else {
        if (!g.burst && p >= 0.28) { g.burst = true; burst(x + cs / 2, y + cs / 2, g.color, REDUCED ? 2 : 5); }
        if (p < 0.28) { const q = p / 0.28; g.s = 1 + 0.18 * easeOutCubic(q); g.a = 1; g.fl = 0.18 + q * 0.72; }
        else { const q = (p - 0.28) / 0.72; g.s = 1.18 * (1 - 0.8 * easeInCubic(q)); g.a = 1 - q * q; g.fl = (1 - q) * 0.9; }
      }
      drawCell(ctx, sprites[g.color], x, y, cs, g.a, g.s);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const g of ghosts) {
      const a = Math.min(1, g.fl * g.a);
      if (a > 0.01) drawCell(ctx, whiteSprite, bx + g.c * cs, by + g.r * cs, cs, a, g.s);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function beamGradient(g, rgb) {
    g.addColorStop(0, 'rgba(' + rgb + ',0)');
    g.addColorStop(0.36, 'rgba(' + rgb + ',0.55)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.64, 'rgba(' + rgb + ',0.55)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    return g;
  }

  function drawBeams(now) {
    if (!beams.length) return;
    const { bx, by, cs, bs, fp } = L;
    ctx.globalCompositeOperation = 'lighter';
    let k = 0;
    for (let j = 0; j < beams.length; j++) {
      const b = beams[j], p = (now - b.t0) / b.dur;
      if (p >= 1) continue;
      beams[k++] = b;
      if (p < 0) continue;
      const a = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
      const grow = easeOutCubic(Math.min(1, p * 2.4));
      const th = cs * (0.5 + 0.9 * p);
      const rgb = COLORS[b.color].rgb;
      ctx.globalAlpha = clamp(a, 0, 1) * 0.9;
      if (b.type === 'row') {
        const cy = by + (b.i + 0.5) * cs;
        const x0 = lerp(b.o, bx - fp, grow), x1 = lerp(b.o, bx + bs + fp, grow);
        ctx.fillStyle = beamGradient(ctx.createLinearGradient(0, cy - th / 2, 0, cy + th / 2), rgb);
        ctx.fillRect(x0, cy - th / 2, x1 - x0, th);
      } else {
        const cx = bx + (b.i + 0.5) * cs;
        const y0 = lerp(b.o, by - fp, grow), y1 = lerp(b.o, by + bs + fp, grow);
        ctx.fillStyle = beamGradient(ctx.createLinearGradient(cx - th / 2, 0, cx + th / 2, 0), rgb);
        ctx.fillRect(cx - th / 2, y0, th, y1 - y0);
      }
    }
    beams.length = k;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function burst(x, y, colorIdx, n) {
    const col = COLORS[colorIdx], k = L.cs / 44;
    for (let i = 0; i < n; i++) {
      const ang = rand(0, Math.PI * 2), sp = rand(70, 280) * k;
      particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 110 * k, life: 0, max: rand(0.4, 0.75), size: rand(0.07, 0.17) * L.cs, color: Math.random() < 0.25 ? '#ffffff' : col.spark });
    }
    if (particles.length > 240) particles.splice(0, particles.length - 240);
  }

  function updateParticles(dt) {
    const g = 950 * (L.cs / 44), damp = 1 - 1.6 * dt;
    let k = 0;
    for (let j = 0; j < particles.length; j++) {
      const p = particles[j];
      p.life += dt;
      if (p.life >= p.max) continue;
      p.vy += g * dt;
      p.vx *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      particles[k++] = p;
    }
    particles.length = k;
  }

  // Kıvılcımlar renk ve saydamlık gruplarına ayrılıp grup başına tek çağrıyla çizilir
  const ALPHA_STEPS = [1, 0.62, 0.3];
  function drawParticles() {
    if (!particles.length) return;
    const buckets = new Map();
    for (const p of particles) {
      const t = p.life / p.max, lvl = t < 0.45 ? 0 : t < 0.75 ? 1 : 2;
      const key = p.color + lvl;
      let b = buckets.get(key);
      if (!b) { b = { color: p.color, a: ALPHA_STEPS[lvl], path: new Path2D() }; buckets.set(key, b); }
      const s = p.size * (1 - t * 0.6);
      b.path.rect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'lighter';
    buckets.forEach(b => { ctx.globalAlpha = b.a; ctx.fillStyle = b.color; ctx.fill(b.path); });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function trayHome(i) { return { x: L.tray.x + L.slotW * (i + 0.5), y: L.tray.y + L.tray.h / 2 }; }
  function trayCs(p) { return Math.min(L.cs * 0.56, (L.slotW * 0.84) / p.w, (L.tray.h * 0.84) / p.h); }

  // Raftaki parçanın görünümü: giriş animasyonu ya da (fareyle) üzerine gelince hafif büyüme
  function trayVisual(p, i, now) {
    const home = trayHome(i), tcs = trayCs(p);
    if (p.enter) { // yeni parça girişi
      const en = p.enter, q = clamp((now - en.t0) / en.dur, 0, 1);
      if (q >= 1) p.enter = null;
      else {
        const e = easeOutBack(q);
        return { x: home.x, y: home.y + (1 - e) * L.tray.h * 0.45, cs: tcs * lerp(0.35, 1, e), a: clamp(q * 3, 0, 1) };
      }
    }
    return { x: home.x, y: home.y, cs: tcs * (1 + 0.08 * (p.hv || 0)), a: 1 };
  }

  // Bırakılamayan parçanın rafa geri uçuşu (efekt katmanında; bitince raf katmanına döner)
  function retVisual(p, i, now) {
    const home = trayHome(i), tcs = trayCs(p), r = p.ret;
    const q = clamp((now - r.t0) / r.dur, 0, 1), e = easeOutCubic(q);
    return { x: lerp(r.x, home.x, e), y: lerp(r.y, home.y, e), cs: lerp(r.cs, tcs, e), done: q >= 1 };
  }

  // Raf katmanı: yalnızca raf değişince ya da giriş/üzerine gelme animasyonu sürerken çizilir
  function renderTray(now) {
    tctx.clearRect(TRG.x, TRG.y, TRG.w, TRG.h);
    for (let i = 0; i < 3; i++) {
      const p = tray[i];
      if (!p || p.ret || (drag && drag.piece === p)) continue;
      const target = hoverSlot === i && !drag && gameState === 'play' ? 1 : 0;
      p.hv = (p.hv || 0) + (target - (p.hv || 0)) * Math.min(1, frameDt * 14);
      const v = trayVisual(p, i, now);
      if (v.a <= 0) continue;
      drawPiece(tctx, p, v.x, v.y, v.cs, v.a, p.fits ? sprites[p.color] : greyOf(p.color));
    }
  }

  function anyRet() { return !!((tray[0] && tray[0].ret) || (tray[1] && tray[1].ret) || (tray[2] && tray[2].ret)); }

  function drawReturns(now) {
    for (let i = 0; i < 3; i++) {
      const p = tray[i];
      if (!p || !p.ret) continue;
      const v = retVisual(p, i, now);
      if (v.done) { p.ret = null; trayDirty = true; continue; }
      drawPiece(ctx, p, v.x, v.y, v.cs, 1, p.fits ? sprites[p.color] : greyOf(p.color));
    }
  }

  function dragVisual(d, now) {
    const q = clamp((now - d.t0) / 150, 0, 1), e = easeOutCubic(q);
    return { x: lerp(d.sx, d.tx, e), y: lerp(d.sy, d.ty, e), cs: lerp(d.scs, L.cs, e) };
  }

  // Efekt katmanı: yalnızca efekt sürerken çizilir
  function renderFx(now) {
    ctx.clearRect(0, 0, L.W, L.H);
    drawPops(now);
    drawGhosts(now);
    drawBeams(now);
    drawParticles();
    drawReturns(now);
  }

  function frame(now) {
    rafId = 0;
    const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 1 / 60;
    last = now;
    frameDt = dt;
    if (displayScore !== score) { // skor sayacı
      displayScore = displayScore < score ? Math.min(score, displayScore + Math.max(1, (score - displayScore) * Math.min(1, dt * 12))) : score;
      setScoreText(displayScore);
    }
    if (gameState !== 'play') { // oyun sonu: satırlar sırayla griye döner
      const g = clamp(Math.floor((now - overT0) / 75), -1, N);
      if (g !== greyRows) { greyRows = g; cellsDirty = true; }
    }
    if (drag) positionDrag(now);
    if (previewDirty) { previewDirty = false; renderPreview(); }
    if (particles.length) updateParticles(dt);
    if (cellsDirty) { cellsDirty = false; renderCells(); }
    const busy = (drag !== null && now - drag.t0 < 170) || now < animUntil || ghosts.length > 0 || beams.length > 0 || particles.length > 0 || pops.length > 0 || anyRet();
    if (fxDirty || busy || wasBusy) { fxDirty = false; renderFx(now); }
    wasBusy = busy;
    // raf katmanı efektlerden sonra: geri uçuşu biten parça aynı karede rafa çizilir
    const trayBusy = now < trayAnimUntil;
    if (trayDirty || trayBusy || trayWasBusy) { trayDirty = false; renderTray(now); }
    trayWasBusy = trayBusy;
    if (busy || trayBusy || trayDirty || displayScore !== score || gameState === 'ending') wake();
    else last = 0;
  }

  /* ================= Girdi: fare + dokunmatik (Pointer Events) ================= */
  // Tuvaller ekranın sol üstüne sabit; olay koordinatları doğrudan kullanılır
  function pointerPos(e) { return { x: e.clientX, y: e.clientY }; }

  function slotAt(x, y) {
    const t = L.tray, padY = t.h * 0.22;
    if (x < t.x - 6 || x > t.x + t.w + 6 || y < t.y - padY || y > t.y + t.h + padY) return -1;
    return clamp(Math.floor((x - t.x) / L.slotW), 0, 2);
  }

  function findSnap(p, cx, cy) {
    const { bx, by, cs } = L;
    const fc = (cx - (p.w * cs) / 2 - bx) / cs, fr = (cy - (p.h * cs) / 2 - by) / cs;
    let pos = null, bestD = 0.8;
    const rs = [Math.floor(fr), Math.ceil(fr)], cl = [Math.floor(fc), Math.ceil(fc)];
    for (const r of rs) {
      for (const c of cl) {
        const dd = Math.hypot(fr - r, fc - c);
        if (dd < bestD && canPlace(p, r, c)) { bestD = dd; pos = { r, c }; }
      }
    }
    if (!pos) return null;
    const ln = linesIfPlaced(p, pos.r, pos.c);
    return { r: pos.r, c: pos.c, rows: ln.rows, cols: ln.cols };
  }

  function updateDrag() {
    const d = drag, p = d.piece, cs = L.cs;
    // Dokunmatikte parça parmağın üstünde durur ki görünsün
    const lift = d.type === 'mouse' ? 0 : (p.h * cs) / 2 + cs * 0.9;
    d.tx = d.px;
    d.ty = d.py - lift;
    d.preview = findSnap(p, d.tx, d.ty);
    const key = d.preview ? p.uid + ':' + d.preview.r + ':' + d.preview.c : '';
    if (key !== previewKey) {
      previewKey = key;
      previewDirty = true;
      dragEl.style.opacity = d.preview ? '0.92' : '1';
    }
  }

  function overBoard(x, y) {
    return x >= L.bx - L.fp && x <= L.bx + L.bs + L.fp && y >= L.by - L.fp && y <= L.by + L.bs + L.fp;
  }

  function endDrag(e, cancelled) {
    if (!drag || (e && e.pointerId !== drag.pid)) return;
    if (e && !cancelled) { const pos = pointerPos(e); drag.px = pos.x; drag.py = pos.y; updateDrag(); }
    const d = drag;
    drag = null;
    canvas.classList.remove('grabbing');
    hideDragEl();
    const now = performance.now();
    if (!cancelled && d.preview && gameState === 'play' && tray[d.slot] === d.piece) {
      commitPlace(d.piece, d.slot, d.preview.r, d.preview.c);
    } else {
      const v = dragVisual(d, now);
      d.piece.ret = { x: v.x, y: v.y, cs: v.cs, t0: now, dur: 200 };
      if (!cancelled && overBoard(v.x, v.y)) Sound.bad();
      animate(240);
    }
    updateHint();
    trayDirty = true;
    wake();
  }

  canvas.addEventListener('pointerdown', e => {
    Sound.unlock();
    if (gameState !== 'play' || drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const { x, y } = pointerPos(e);
    const i = slotAt(x, y);
    if (i < 0 || !tray[i]) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* yakalama yok */ }
    const p = tray[i], now = performance.now();
    const v = p.ret ? retVisual(p, i, now) : trayVisual(p, i, now);
    p.ret = null; p.enter = null; p.hv = 0;
    drag = { piece: p, slot: i, pid: e.pointerId, type: e.pointerType || 'mouse', px: x, py: y, sx: v.x, sy: v.y, scs: v.cs, t0: now, tx: v.x, ty: v.y, preview: null };
    previewKey = '';
    updateDrag();
    prepareDragEl(p);
    positionDrag(now);
    dragEl.classList.add('on');
    updateHint();
    Sound.pick();
    canvas.classList.remove('grab');
    canvas.classList.add('grabbing');
    trayDirty = true; // raftaki parça artık elde
    fxDirty = true;
    wake();
  });

  canvas.addEventListener('pointermove', e => {
    const { x, y } = pointerPos(e);
    if (drag) {
      if (e.pointerId !== drag.pid) return;
      drag.px = x; drag.py = y;
      updateDrag();
      wake();
      return;
    }
    if (e.pointerType === 'mouse') {
      const i = slotAt(x, y);
      const h = gameState === 'play' && i >= 0 && tray[i] ? i : -1;
      if (h !== hoverSlot) { hoverSlot = h; canvas.classList.toggle('grab', h >= 0); animateTray(400); }
    }
  });

  canvas.addEventListener('pointerleave', () => {
    if (!drag && hoverSlot !== -1) { hoverSlot = -1; canvas.classList.remove('grab'); animateTray(400); }
  });
  canvas.addEventListener('pointerup', e => endDrag(e, false));
  canvas.addEventListener('pointercancel', e => endDrag(e, true));
  canvas.addEventListener('lostpointercapture', e => { if (drag && e.pointerId === drag.pid) endDrag(e, true); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.target === canvas || drag) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  window.addEventListener('blur', () => { if (drag) endDrag(null, true); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (drag) endDrag(null, true); Sound.pause(); }
  });
  // iPhone sesi yalnızca gerçek bir dokunuşun içinde açar: her dokunuş ve tıklamada yeniden dene
  ['touchend', 'click', 'pointerup', 'keydown'].forEach(t => document.addEventListener(t, () => Sound.unlock(), { passive: true, capture: true }));

  /* ================= Düğmeler ================= */
  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" fill-opacity=".22"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" fill-opacity=".22"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';

  function setSound(on, fromUser) {
    soundOn = on;
    store.set(K_SOUND, on);
    btnSound.innerHTML = on ? ICON_ON : ICON_OFF;
    btnSound.setAttribute('aria-label', on ? 'Sesi kapat' : 'Sesi aç');
    btnSound.title = on ? 'Sesi kapat' : 'Sesi aç';
    if (on && fromUser) { Sound.unlock(); Sound.pick(); }
    if (!on) Sound.pause();
  }

  btnSound.addEventListener('click', () => setSound(!soundOn, true));
  btnRestart.addEventListener('click', () => {
    if (gameState !== 'play' || moves === 0) { newGame(); return; }
    ovConfirm.hidden = false;
    setModal();
    focusDialog('btnCancel', 'cfCard');
  });
  const closeConfirm = () => { ovConfirm.hidden = true; setModal(); };
  $('btnCancel').addEventListener('click', closeConfirm);
  $('btnConfirm').addEventListener('click', () => { ovConfirm.hidden = true; newGame(); });
  $('btnAgain').addEventListener('click', () => newGame());
  ovConfirm.addEventListener('pointerdown', e => { if (e.target === ovConfirm) closeConfirm(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !ovConfirm.hidden) closeConfirm(); });

  /* ================= Boyut değişimi ================= */
  let resizeRaf = 0;
  function onResize() {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => { layout(); if (drag) updateDrag(); });
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  // Test kancası: yalnızca adres #test ile açıldığında etkin
  if (/(^|&)test\b/.test(location.hash.slice(1))) {
    window.__test = {
      info: () => ({
        mode: L.mode, cs: L.cs, bx: L.bx, by: L.by, bs: L.bs, fp: L.fp, tray: L.tray, slotW: L.slotW, hud: L.hud,
        state: gameState, score, combo, comboMoves, best, moves, linesTotal, maxCombo, photo: PHOTOS.every((ph, k) => !!photoImgs[k]), photoIdx: PHOTO_IDX, photoOf: PHOTO_OF,
        board: Array.from(board), pieces: tray.map(p => p && { id: p.shape.id, w: p.w, h: p.h, color: p.color, fits: p.fits, cells: p.cells })
      }),
      setBoard: arr => { board.set(arr); pops = []; refreshFits(); cellsDirty = true; fxDirty = true; wake(); },
      setTray: ids => { tray = ids.map((id, i) => (id ? makePiece(SHAPE_BY_ID[id], i % PALETTE.length) : null)); refreshFits(); },
      check: () => { if (!tray.some(p => p && p.fits)) triggerGameOver(); },
      setScore: n => { score = n; displayScore = n; if (score > best) setBest(score); setScoreText(score); updateHud(); },
      audio: () => ({ state: Sound.ac ? Sound.ac.state : 'none', session: navigator.audioSession ? navigator.audioSession.type : 'yok' }),
      // Bir sesi çevrimdışı çizip tepe ve ortalama seviyesini döndürür (cızırtı / kısıklık denetimi)
      renderSound: async (name, a, b) => {
        const ac = new OfflineAudioContext(1, Math.round(44100 * 1.6), 44100);
        const saved = [Sound.ac, Sound.out, Sound.nbuf, Sound.resumeT, soundOn];
        Sound.ac = ac; Sound.out = Sound.chain(ac); Sound.nbuf = null; Sound.resumeT = performance.now(); soundOn = true;
        try { Sound[name](a, b); } finally { [Sound.ac, Sound.out, Sound.nbuf, Sound.resumeT, soundOn] = saved; }
        const d = (await ac.startRendering()).getChannelData(0);
        let peak = 0, sq = 0, n = 0;
        for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; if (v > 0.001) { sq += v * v; n++; } }
        return { peak: +peak.toFixed(3), rms: +(n ? Math.sqrt(sq / n) : 0).toFixed(3), ms: Math.round((n / 44100) * 1000) };
      },
      newGame
    };
  }

  /* ================= Başlat ================= */
  // Sayfa güncellendiğinde açık oyun kaybolmasın (görüntüleyici destekliyorsa)
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(() => snapshotState()); } catch (e) { /* desteklenmiyor */ }
  }
  let booted = false;
  function boot(data) {
    if (booted) return;
    booted = true;
    setSound(soundOn, false);
    layout();
    // Kayıtlı oyun varsa kaldığı yerden devam, yoksa yeni oyun
    const restored = (data && data.v === 2 && load(data)) || load();
    if (!restored) newGame();
    wake();
  }
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(boot); } catch (e) { boot(); }
    setTimeout(() => boot(), 1500);
  } else {
    boot(hot ? hot.data : undefined);
  }
})();
</script>
<script>
  // Çevrimdışı oynama: oyun bir kez internetle açılınca dosyaları telefona kaydeden hizmet çalışanı (sw.js)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
