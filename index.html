<style>
  /* Yerleşim: dikey ekranda tek sütun (HUD → 8x8 tahta → 3'lü raf), yatay ekranda tahta solda, HUD + raf sağda.
     Akıcılık için katmanlı çizim:
       bg     – yıldızlar, tahta çerçevesi, raf paneli: yalnızca ekran boyutu değişince çizilir
       cells  – yerleşmiş bloklar: yalnızca tahta değişince
       hl     – yerleştirme önizlemesi: yalnızca parçanın oturacağı kare değişince
       trayCv – raftaki parçalar: yalnızca raf değişince ya da giriş animasyonunda
       game   – patlama efektleri (daha düşük çözünürlükte): yalnızca efekt sürerken
       dragEl – sürüklenen parça: bir kez çizilir, GPU'da kaydırılır
     Skor, kombo ve uçan yazılar HTML/CSS; süreğen animasyonlar yalnızca opaklık/dönüşüm kullanır. */
  :root {
    --bg: #050817;          /* gece laciverti */
    --panel: #0b1438;       /* panel laciverti */
    --line: rgba(92, 160, 255, .38);
    --blue: #2b8cff;        /* neon mavi */
    --cyan: #2be3ff;        /* camgöbeği parıltı */
    --gold: #ffc531;        /* kahraman altını */
    --text: #eaf2ff;
    --muted: #8ea6d8;
    --display: "Russo One", "Arial Black", "Segoe UI", system-ui, sans-serif;
    --ui: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    --u: 344px;             /* tahta genişliği (JS günceller) */
    --cs: 43px;             /* hücre boyu (JS günceller) */
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    background:
      radial-gradient(120% 65% at 50% -12%, rgba(43, 110, 255, .30), transparent 62%),
      radial-gradient(90% 45% at 50% 112%, rgba(255, 165, 40, .13), transparent 62%),
      radial-gradient(55% 40% at -5% 55%, rgba(24, 212, 242, .08), transparent 70%),
      radial-gradient(55% 40% at 105% 45%, rgba(110, 112, 255, .08), transparent 70%),
      linear-gradient(180deg, #070b22 0%, #050817 55%, #03050e 100%);
    background-color: var(--bg);
  }
  canvas { display: block; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .region { position: absolute; left: 0; top: 0; pointer-events: none; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 2; }
  #game { pointer-events: auto; touch-action: none; }
  #game.grab { cursor: grab; }
  #game.grabbing { cursor: grabbing; }
  #hl.pulse { animation: hlPulse .26s ease-in-out infinite alternate; }
  #dragEl { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; visibility: hidden; will-change: transform; transform-origin: 50% 50%; }
  #dragEl.on { visibility: visible; }

  /* Parlayıp sönen birkaç yıldız: küçük öğeler, yalnızca opaklık animasyonu */
  #twinkle { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #twinkle i {
    position: absolute;
    width: 2px;
    height: 2px;
    margin: -1px 0 0 -1px;
    border-radius: 50%;
    background: #d4e7ff;
    box-shadow: 0 0 4px 1px rgba(166, 205, 255, .75);
    opacity: .2;
    will-change: opacity;
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  #twinkle i.g { background: #ffe8a8; box-shadow: 0 0 4px 1px rgba(255, 215, 106, .75); }

  /* Kombo sürerken tahtanın çevresindeki altın hale */
  #ringWrap { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #ring {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: max(2px, calc(var(--cs) * .06)) solid rgba(255, 197, 49, .9);
    box-shadow: 0 0 calc(var(--cs) * .5) rgba(255, 170, 30, .85), inset 0 0 calc(var(--cs) * .3) rgba(255, 170, 30, .4);
    will-change: opacity;
    animation: ringPulse 1.05s ease-in-out infinite alternate;
  }

  /* Üst bilgi alanı (HTML: yazılar bir kez çizilir, her karede değil) */
  #hud { position: fixed; z-index: 1; left: 0; top: 0; pointer-events: none; }
  .hud-title {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--ya, 24px);
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5em;
    font: 400 max(11px, calc(var(--u) * .046))/1 var(--display);
    letter-spacing: .02em;
    color: var(--gold);
    text-shadow: 0 0 .45em rgba(255, 180, 40, .75), 0 .06em 0 rgba(160, 80, 0, .55);
    white-space: nowrap;
  }
  .hud-title svg { width: 1.1em; height: 1.1em; flex: none; fill: var(--gold); filter: drop-shadow(0 0 .22em rgba(255, 197, 49, .9)); }
  .hud-score {
    position: absolute;
    left: 50%;
    top: var(--yb, 70px);
    transform: translate(-50%, -50%);
    font: 400 44px/1 var(--display);
    color: #f2f9ff;
    text-shadow: 0 0 .28em rgba(43, 160, 255, .95), 0 .04em 0 rgba(40, 110, 220, .8);
    white-space: nowrap;
  }
  .hud-score span { display: inline-block; will-change: transform; }
  .hud-side {
    position: absolute;
    top: var(--yb, 70px);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: calc(var(--u) * .014);
    white-space: nowrap;
  }
  .hud-best { left: var(--pad, 5px); align-items: flex-start; }
  .hud-combo { right: var(--pad, 5px); align-items: flex-end; }
  .hud-label {
    display: flex;
    align-items: center;
    gap: .3em;
    font: 700 max(10px, calc(var(--u) * .034))/1 var(--ui);
    letter-spacing: .03em;
    color: var(--muted);
  }
  .hud-label svg { width: 1.15em; height: 1em; flex: none; fill: var(--gold); filter: drop-shadow(0 0 .2em rgba(255, 197, 49, .85)); }
  .hud-val { font: 400 max(13px, calc(var(--u) * .054))/1 var(--display); }
  #hudBest { color: #ffd45e; text-shadow: 0 0 .35em rgba(255, 190, 40, .55); }
  .hud-cval { display: flex; align-items: center; gap: max(6px, calc(var(--u) * .02)); }
  .hud-combo .hud-label { color: #53648f; }
  .hud-combo.on .hud-label { color: #9fe9ff; }
  #hudCombo { display: inline-block; color: #34416a; transform-origin: 100% 50%; }
  .hud-combo.on #hudCombo { color: #5ff0ff; text-shadow: 0 0 .35em rgba(43, 227, 255, .9); }
  .pips { display: none; gap: max(4px, calc(var(--u) * .014)); }
  .hud-combo.on .pips { display: flex; }
  .pips i { display: block; width: max(4px, calc(var(--u) * .011)); height: max(4px, calc(var(--u) * .011)); transform: rotate(45deg); border: 1px solid rgba(140, 160, 210, .5); }
  .pips i.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px rgba(255, 197, 49, .9); }

  /* İlk açılış ipucu */
  #hint {
    position: fixed;
    z-index: 3;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--cs) * .14);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    animation: hintPulse 1.6s ease-in-out infinite alternate;
  }
  #hint b { font: 400 calc(var(--cs) * .42)/1 var(--display); color: #d6e8ff; text-shadow: 0 0 .4em rgba(43, 160, 255, .9); }
  #hint span { font: 600 calc(var(--cs) * .36)/1 var(--ui); color: #8fb3e8; }

  /* Uçan yazılar: HARİKA!, KOMBO ×12, +130 */
  #floats { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: hidden; }
  .float {
    position: absolute;
    left: 0;
    top: 0;
    white-space: nowrap;
    font-family: var(--display);
    line-height: 1;
    opacity: 0;
    will-change: transform, opacity;
    animation: floatUp .95s ease-out both;
  }
  .float-praise { font-size: calc(var(--cs) * .95); color: #ffd040; text-shadow: 0 .06em 0 #8a4200, 0 0 .07em rgba(4, 8, 26, .95), 0 0 .3em rgba(255, 170, 30, .95), 0 0 .8em rgba(255, 130, 20, .5); }
  .float-combo { font-size: calc(var(--cs) * .72); color: #63eeff; text-shadow: 0 .06em 0 #0b3a80, 0 0 .07em rgba(4, 8, 26, .95), 0 0 .3em rgba(43, 227, 255, .95), 0 0 .8em rgba(43, 140, 255, .5); }
  .float-pts { font-size: calc(var(--cs) * .62); color: #ffffff; text-shadow: 0 .06em 0 #0d2c6e, 0 0 .07em rgba(4, 8, 26, .95), 0 0 .3em rgba(80, 190, 255, .95); }

  .icon-btn {
    position: fixed;
    z-index: 5;
    left: 12px;
    top: 12px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(22, 40, 100, .88), rgba(9, 16, 48, .88));
    color: #cfe2ff;
    box-shadow: 0 0 16px rgba(43, 140, 255, .22), inset 0 1px 0 rgba(255, 255, 255, .09);
    cursor: pointer;
    transition: transform .12s ease, border-color .2s ease, color .2s ease;
  }
  .icon-btn:hover { border-color: rgba(43, 227, 255, .65); color: #fff; }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .icon-btn svg { width: 52%; height: 52%; display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(80% 60% at 50% 42%, rgba(12, 24, 70, .55), rgba(2, 4, 14, .84));
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    animation: ov-in .35s ease both;
    touch-action: manipulation;
  }
  .card {
    position: relative;
    flex: none;
    margin: auto;
    width: min(360px, 100%);
    padding: 26px 22px 22px;
    border-radius: 24px;
    text-align: center;
    background: linear-gradient(180deg, rgba(17, 30, 78, .97), rgba(7, 12, 36, .98));
    border: 1px solid rgba(92, 170, 255, .42);
    box-shadow: inset 0 0 0 1px rgba(255, 197, 49, .08), 0 24px 70px rgba(0, 0, 0, .6), 0 0 50px rgba(43, 140, 255, .28);
    animation: card-in .55s cubic-bezier(.2, 1.3, .35, 1) both;
  }
  .card:focus { outline: none; }
  .card::before {
    content: "";
    position: absolute;
    left: 20%;
    right: 20%;
    top: -1px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow: 0 0 12px var(--gold);
  }
  .title {
    margin: 2px 0 4px;
    font: 400 clamp(30px, 9vw, 40px)/1.08 var(--display);
    letter-spacing: .04em;
    text-wrap: balance;
    color: var(--gold);
    /* Düz renk + gölge: her tarayıcıda (iPhone dahil) aynı görünür */
    text-shadow: 0 0 16px rgba(255, 190, 40, .55), 0 0 34px rgba(255, 150, 40, .3);
  }
  .title.small { font-size: clamp(24px, 7vw, 30px); }
  .sub { margin: 0 0 18px; color: var(--muted); font-weight: 600; font-size: 16px; }
  .label { font: 700 13px/1 var(--ui); letter-spacing: .3em; color: #7fb6ff; }
  .big-score {
    margin: 6px 0 18px;
    font: 400 clamp(46px, 14vw, 62px)/1.05 var(--display);
    color: #fff;
    text-shadow: 0 0 18px rgba(43, 180, 255, .8), 0 0 42px rgba(43, 140, 255, .45);
    font-variant-numeric: tabular-nums;
  }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
  .stat { min-width: 0; padding: 10px 4px; border-radius: 14px; background: rgba(12, 22, 62, .78); border: 1px solid rgba(92, 160, 255, .2); }
  .stat span { display: block; font: 700 11px/1.2 var(--ui); letter-spacing: .06em; color: var(--muted); }
  .stat b { display: block; margin-top: 5px; font: 400 18px/1.1 var(--display); color: var(--gold); text-shadow: 0 0 10px rgba(255, 190, 40, .35); font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block;
    margin-bottom: 10px;
    padding: 7px 14px 6px;
    border-radius: 999px;
    font: 700 13px/1 var(--ui);
    letter-spacing: .2em;
    color: #241500;
    background: linear-gradient(180deg, #ffe892, #ffb51f);
    box-shadow: 0 0 22px rgba(255, 197, 49, .7);
    animation: pulse 1.3s ease-in-out infinite;
  }
  .btn {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    border: 0;
    cursor: pointer;
    padding: 15px 18px 14px;
    border-radius: 16px;
    font: 700 18px/1 var(--ui);
    letter-spacing: .14em;
    transition: transform .12s ease, filter .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .btn-primary {
    color: #041230;
    background: linear-gradient(180deg, #86ecff 0%, #2b8cff 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28), 0 8px 24px rgba(43, 140, 255, .45), 0 0 30px rgba(43, 227, 255, .3);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { color: var(--text); background: rgba(20, 34, 86, .85); box-shadow: inset 0 0 0 1px var(--line); }
  .btn-ghost:hover { filter: brightness(1.15); }
  .btn-row { display: flex; gap: 10px; }
  @media (max-height: 560px) {
    .card { padding: 16px 18px; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #insetProbe {
    position: fixed;
    left: 0;
    top: 0;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  /* Kod çalıştırmayan önizlemeler (WhatsApp, iPhone Dosyalar) için açıklama ekranı; yalnızca <noscript> içinde görünür */
  .nojs {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(120% 60% at 50% -10%, rgba(43, 110, 255, .32), transparent 62%), linear-gradient(180deg, #070b22, #050817 60%, #03050e);
    background-color: #050817;
    color: var(--text);
    font: 500 17px/1.45 var(--ui);
    -webkit-user-select: text;
    user-select: text;
    touch-action: auto;
  }
  .nojs-card {
    margin: auto;
    width: min(420px, 100%);
    padding: 24px 22px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(17, 30, 78, .97), rgba(7, 12, 36, .98));
    border: 1px solid rgba(92, 170, 255, .42);
    box-shadow: 0 0 40px rgba(43, 140, 255, .25);
  }
  .nojs-title { margin: 0 0 16px; font: 400 26px/1.1 var(--display); letter-spacing: .04em; color: var(--gold); text-shadow: 0 0 16px rgba(255, 190, 40, .5); }
  .nojs-lead { margin: 0 0 8px; font-weight: 700; font-size: 20px; color: #fff; }
  .nojs p { margin: 0 0 14px; color: #c9d8f5; }
  .nojs ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; color: #c9d8f5; }
